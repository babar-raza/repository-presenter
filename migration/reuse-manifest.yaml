file_records: []

acceptance:
  per_pull_gate: every gate from G1_FIRST_VALID_CANDIDATE onward
  census_gate: G3_SEVEN_ECOSYSTEM_REPRESENTATIVES
  status: NOT_READY
  per_pull_predicates:
    - Every pulled file or asset has one exact file record whose hash matches the frozen revision.
    - Every retained behavior of a pulled file maps to destination tests in the same work item.
    - Every destination compiles without a retired dependency; a pull across CPL-01 or CPL-02 requires the chain to be proven cut first.
    - Every pulled module has a production importer exercised by the official entry point.
  census_predicates:
    - The freeze decision for uncommitted legacy changes is recorded and no pulled behavior depends on an uncommitted change.
    - Every legacy production file and asset is either pulled with a record or RETIRE.
    - Final file and line totals reconcile with the clean source inventory.
    - No percentage or completion claim relies only on expected area dispositions.
