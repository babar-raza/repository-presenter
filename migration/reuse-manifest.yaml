preliminary_coupling_findings:
  measured_at: "2026-09-02"
  method: static import-closure analysis (ast) over src/readme_agent at the frozen revision; 156 seed-retained modules analysed
  retained_modules_reaching_a_retired_module: 31
  retained_modules_reaching_supervisor_capabilities_or_specialists: 13
  findings:
    - id: CPL-01
      chain: llm.call_transport -> llm.prompt_registry -> readme.facts (sha256_text) -> validation.registry (VALIDATION_RULESET_VERSION) -> validation.rules.change_boundary -> readme.markers
      affected: every llm/* module, presentation/claim_validation, presentation/verified_source_*, readme/assessment, readme/agentic_composition, validation/public_quality_*
      required_cut: Move sha256_text and the ruleset version into core hashing and the validation registry; readme/markers stays RETIRE.
    - id: CPL-02
      chain: evidence.writer -> evidence.manifest_v2 -> state.schema -> state.proposal_schema -> capabilities.schema (OrgRepoRef)
      affected: evidence/writer, evidence/manifest_v3, state/git_backend, state/cas, state/recovery, state/health, state/freshness_contract, registry/revision_store
      required_cut: Extract shared identity types into core; capabilities/schema.py has 62 direct importers.
    - id: CPL-03
      chain: specialists.separated_readme_review -> capabilities.dispatcher -> capabilities.registry -> capabilities.check_install_path -> orchestrator -> readme.candidate_pipeline
      closure: 592 modules / 115816 lines, including the vendored tree
      required_cut: Reimplement the reviewer-separation contract narrowly; the legacy module cannot be extracted as a unit.
    - id: CPL-04
      chain: commands_supervision -> commands_compatibility._durable_state_backend
      note: A RETIRE module supplies the production state-backend factory; relocate before retiring.
    - id: CPL-05
      chain: paths.runs_dir() defaults to Path.cwd()/runs; 69 direct importers of paths
      note: Global cwd-relative path assumption; the new runtime root must be explicit.
    - id: CPL-06
      chain: 15 production modules (30 references) name plans/investigations/... evidence paths, including env.py, evidence/writer.py, state/schema.py, ecosystems/resolver.py, llm/planner_client.py
      note: Runtime coupling to the legacy plans tree; classify each reference as fixture, oracle, or dead before porting.
    - id: CPL-07
      chain: env.py resolves GH_TOKEN then GITHUB_PAT unless README_AGENT_PRODUCTION_AUTH=github_app
      note: The fail-closed production mode required by plans/idea.md exists; port github_app as the only production mode and keep the PAT path for local act runs only.
    - id: CPL-08
      chain: 11 specialists modules import langgraph or langchain-core
      note: separated_readme_review does not import them directly; the new project decides its orchestration dependency explicitly rather than inheriting it.

