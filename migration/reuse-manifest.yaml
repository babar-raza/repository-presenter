  per_pull_checks:
    - Compute the import closure of the source file before pulling; the pull fails if it drags a RETIRE module or any supervisor, capabilities, or specialists module.
    - Record the exact SHA-256 of the file at the frozen revision, taken from a git archive extracted to a short path.
    - Port or write the tests that cover every retained behavior in the same work item.
    - Record provenance per file; the legacy repository has no LICENSE file, and this repository's MIT license governs the ported result.
    - Run the official entry point on the canary after the pull; a pulled module with no production importer is a defect.
  census_checks:
    - Verify the frozen source revision exists and record its commit metadata. (done 2026-09-02; see source.revision_metadata)
    - Reconcile the dirty legacy working tree observed at freeze. (default exclusion applied as owner item OWNER-03; see source.working_tree_at_freeze)
    - Record the legacy test-suite pass/fail baseline on a Linux runner before the first pull so ported-test failures are attributable.
    - Classify every non-Python production asset listed under expected_asset_dispositions as pulled or retired.
    - Measure final file, line, and test totals by disposition at the G3 census; everything unpulled is RETIRE.
    - Prove no retired mission, trusted-lane, cohort, or promotion dependency entered any pulled closure.

allowed_dispositions:
  PORT_NEARLY_INTACT: Same responsibility and public contract; port with provenance and tests.
  EXTRACT_AND_REFACTOR: Retain bounded behavior while removing obsolete coupling.
  ADAPT_AS_PLUGIN: Convert ecosystem, family, or product behavior to a registered adapter.
  FIXTURE_OR_ORACLE_ONLY: Retain only as immutable regression or evaluation evidence.
  MIGRATION_READER_ONLY: Read legacy data but emit only current schemas and state.
  RETIRE: Do not include in the new production runtime.

