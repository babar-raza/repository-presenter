defect_classes:
  - id: DEF-01
    name: second H1
    repositories: [aspose-cells-foss/Aspose.Cells-FOSS-for-Go]
    detector: {kind: existing, ref: "text_checks.single_h1; BC-07", measure: second_h1, where: {second_h1: true}}
    correction: Demote the stray H1 to a bold note or fold its sentence into Installation prose; keep the sentence.
    preserves: the sentence text and its place in Installation
    rules: [STR-01]
  - id: DEF-02
    name: unbalanced details tags
