decisions:
  # Every decision below was answered by the owner through the interactive form on 2026-10-11.
  # The code gates that still encode the replaced rule migrate on a later governed cut
  # (docs/README_STANDARD.md section 6.2); until then the ruling governs generation policy.
  - id: OD-01
    question: >-
      The banner links to products.aspose.org above the opening, which plans/idea.md read as
      promotion before the product is explained, while the live portfolio does it in
      {obs:banner_present} READMEs.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R1: the banner above the opening, one image with a single link to
      products.aspose.org/{family}/{platform}/, is correct and is not promotion before the product
      is explained; plans/idea.md was wrong and is corrected. A live banner is preserved exactly
      and none is added to a README that lacks one (the live README stands). The
      promotion_after_product predicate exempts the banner link.
    migration: >-
      Item 14 (text_checks.promotion_after_product exempts the banner link) and item 7 (the
      banner counts as one of the five Aspose links). Owner-ruled, pending the next governed cut.
    rules: [STR-05, LNK-02]
  - id: OD-02
    question: >-
      plans/idea.md asked for a 'full-featured ... Enterprise Edition' anchor and BC-06 enforces
      the prefix; no live anchor uses it ({obs:enterprise_full_featured_anchor}).
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R2: the live anchor is correct and plans/idea.md was wrong. The anchor reads
      'Aspose.<Family> for <Platform> — Enterprise Edition' with a spaced em dash, as the live
      READMEs write it ({obs:enterprise_anchor_em_dash} use that dash; the family alone,
      'Aspose.<Family> — Enterprise Edition', when the verified target is the family page). The
      'full-featured' prefix is not required and is not checked.
    migration: >-
      Item 7 (the BC-06 anchor-prefix check in validation/links/rules.py and validation/registry.py
      becomes an anchor-shape check) and item 3 (the renderer prints the live shape). Owner-ruled,
      pending the next governed cut.
    rules: [LNK-04]
  - id: OD-03
    question: >-
      README_CONTRACT row 7 caps Key Capabilities at three to eight items; only
      {obs:capabilities_3_to_8} live READMEs stay inside that range.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R6: the default is accepted. The live count stands; there is no cap on Key Capabilities in
      live-first mode.
    migration: >-
      Item 10 (capabilities_min and capabilities_max in composition/policy.py) and item 2 (the
      range check in composition/planning.py). Owner-ruled, pending the next governed cut.
    rules: [STR-09]
  - id: OD-04
    question: >-
      plans/idea.md said source tone and prose structure are not preservation obligations and that
      the approved presentation template owns tone, headings and organization; the 2026-10-11
      directive says the opposite.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R4: that line of plans/idea.md was wrong. Follow each live README for tone, prose structure
      and headings; plans/idea.md is corrected at the owner's explicit request.
    migration: >-
      Item 4 (reconciliation defaults to keep-in-place), item 2 (planning is edits, not sections)
      and item 12 (documents that name the contract as the structure authority); plans/idea.md
      itself is already corrected. Owner-ruled, pending the next governed cut.
    rules: [PRC-01]
  - id: OD-05
    question: >-
      The owner's badge order (package, runtime, build, license, contributors) is followed by
      {obs:badge_order_ok} of the live rows that have two or more badges.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R6: the default is accepted. The order applies only to badges the change adds; an existing
      row is never reordered on its own.
    migration: >-
      Item 5 (the BC-07 badge-order check becomes baseline-relative). Owner-ruled, pending the
      next governed cut.
    rules: [STR-04]
  - id: OD-06
    question: >-
      The visible-length budget is 300 lines in code and 320 in the contract;
      {obs:visible_lines_over_300} live READMEs exceed 300.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R6: the default is accepted. Visible length may not grow except to add a required element;
      nothing is trimmed to a budget.
    migration: >-
      Item 5 (the BC-07 visible-length check) and item 10 (visible_lines_budget in
      composition/policy.py, also read by repair/rounds.py). Owner-ruled, pending the next governed
      cut.
    rules: [STR-24]
  - id: OD-07
    question: >-
      {obs:commercial_substitute} live READMEs use 'commercial' for the aspose.com product; the
      owner rule allows Enterprise Edition only.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R3: the aspose.com product is always called Enterprise Edition, with no exception (the owner
      chose 'Enterprise Edition' over 'Enterprise product'). 'Commercial', 'paid', 'full' and any
      similar word standing for it are always rewritten to Enterprise Edition, with the diff shown
      to the reviewer; a phrase about the code's own origin is not about the product and is left.
    migration: >-
      Item 7 (the BC-06 banned list and the commercial-substitute heuristic) and item 14
      (text_checks.edition_name). Owner-ruled, pending the next governed cut.
    rules: [LNK-03]
  - id: OD-08
    question: >-
      Cells Go documents the v26.7.1 release while main is ahead of that release; no policy said
      whether a README documents the release, main, or both.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R6: the default is accepted. The README documents the release and marks main-only features
      unreleased (PRC-08).
    migration: >-
      Item 13 (the published-versus-head claim model in the live-first lane) and item 5 (BC-14).
      Owner-ruled, pending the next governed cut.
    rules: [PRC-08]
  - id: OD-09
    question: >-
      Is the structure a fixed template? The standard allowed a section beyond the standard set
      only as a justified deviation, while {obs:inherited_additions_present} live READMEs carry
      headings of their own.
    status: owner_ruled
    ruled: "2026-10-11"
    ruling: >-
      R5: there are two kinds of structure. The fixed core is the sections every product's
      candidate shares. The inherited additions are the extra headings some live READMEs carry
      (History, an MCP server section where supported, and similar); they must be retained in
