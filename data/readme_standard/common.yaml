# The common schema of the README standard: the elements every README may carry, the rules that
# govern their structure, composition, links, tone and detail, and the defect classes the survey
# found in live READMEs. Validated by tools/readme_standard/check_profiles.py against schema.yaml;
# every rule and defect id here is also named in docs/README_STANDARD.md, which carries the
# prose. Frequencies live in observations.yaml (recomputed from survey.json), never here.
schema_version: 1

standard:
  name: README standard v1
  status: >-
    normative for generation policy from 2026-10-11, with the owner rulings R1 to R7 of that date
    applied (docs/DECISION_LOG.md); code enforcement is owner-ruled and pending the next governed
    cut, the migration in docs/README_STANDARD.md section 6, until which docs/README_CONTRACT.md
    section 2 remains the legacy encoding of what the code does
  directive: >-
    docs/README_CONTRACT.md IS NOT THE STRUCTURE & COMPOSITION STANDARD. WE NEED TO FOLLOW THE
    LIVE UPSTREAM REPO README FOR EACH CASE. CORRECT THIS EVERYWHERE, ESPECIALLY IN
    README_CONTRACT.MD, SO NEXT TIME IT IS UPDATED. DEFINE A COMMON SCHEMA FOR OVERALL STRUCTURE
    AND COMPOSITION, LINKS, TONE, EVERYTHING, AND A SCHEMA FOR PRODUCT-WISE DIFFERENCES. WITH
    EVERY ITERATION WE NEED TO DO BETTER THAN WHAT IS CURRENTLY LIVE. (owner, 2026-10-11)
  survey: >-
    the registry repositories with a README, live default-branch heads captured 2026-10-11
    (survey.json); measured by tools/readme_standard/survey_features.py

precedence:
  - rank: 1
    name: verified truth
    statement: >-
      A fact verified at the exact upstream revision (registry answer, manifest, compiler output,
      the tree) beats any text, live or standard. Nothing false is kept and nothing unverified is
      added.
  - rank: 2
    name: owner rules
    statement: >-
      Standing constraints of plans/idea.md (as the owner corrected it on 2026-10-11) and the
      directive: one factual H1, one badge row, Enterprise Edition as the only name of the
      aspose.com product, product explained before promotion (the linked banner above the opening
      is not promotion, OD-01), no assurance narration, no invented claims. Where a live README breaks one and a
      deterministic detector proves it, correct it with the smallest edit; where a rule and the
      live README disagree and the rule is not about truth or naming, the disagreement is an open
      decision and the live README stands (section 7).
  - rank: 3
    name: the live README
    statement: >-
      Its heading skeleton, order, wording, voice, links, examples and tone are preserved. The
      standard never restructures, renames, reorders or rewrites what the maintainers wrote
      unless rank 1 or rank 2 forces a correction.
  - rank: 4
    name: common conventions
    statement: >-
      OBSERVED_COMMON rules (at least 80 percent of the live READMEs) fill the gaps a live README
      leaves, in the shape the portfolio already uses.
  - rank: 5
    name: variant conventions
    statement: >-
      OBSERVED_VARIANT rules apply only through the repository's archetype and axes
      (assignments.yaml), never as a portfolio-wide default.

structure_kinds:
  core: >-
    The fixed core: the sections every product's candidate shares, the elements of kind core
    below. A core element is present in the output, added from verified facts when the live README
    lacks it, as far as its requirement for the archetype and its condition say.
  inherited: >-
    The inherited additions: any heading or section beyond the fixed core that a live README
    carries (History, an MCP server section where the product supports one, Project Structure,
    Feature Showcase, a persona or provenance section, and similar). Each is retained in place
    with its text, level and order; it is not a deviation and needs no justification; its content
    is judged by the unit dispositions. The standard never adds one.

axes:
  install_channel:
    registry: >-
      installed from a package registry: PyPI, NuGet, Maven Central, npm, crates.io, or the Go
      module proxy
    source_only: >-
      no registry install: clone and build, pip install -e, npm install from a clone,
      ProjectReference, or a Git dependency; the README says so and says when not published
    native_build: >-
      C++ library integrated through CMake (add_subdirectory, FetchContent, find_package),
      optionally with a Windows-only prebuilt NuGet package
    none: the README gives no install path, or no README exists
  api_size_class:
    none: no API listing (no API Reference table or member list)
    S: 1 to 49 listed entries; the listing is short enough to read in full
    M: 50 to 199 listed entries
    L: 200 to 499 listed entries
    XL: 500 or more listed entries; the README is a reference document and stays collapsed
  voice:
    neutral_reference: >-
      declarative third-person present tense with the product as subject; the portfolio default
    scope_forward: >-
      states in the opening what the library is not (not a renderer, not a converter) and leads
      the limits before the capabilities
    concise_minimal: terse imperative fragments, mean sentence under 12 words, almost no identifiers
    candid_handwritten: >-
      hand-written, sceptical and measured; states what is verified and when it was measured;
      sentence-case headings; steers readers to a sibling edition
    narrative_marketing: >-
      provenance story, star call to action, conversational we and you, emoji; the least
      conventional register in the portfolio
    persona_pitch: >-
      persona and buyer framing, workflow tables, second person, sales vocabulary; a CLI and MCP
      product pitch rather than a library reference
  surfaces:
    library: a public API consumed from code
    cli: a command-line interface documented in the README
    mcp: an MCP server or MCP tool handlers documented in the README
  special_structures:
    project_structure: an H2 Project Structure with a fenced directory tree
    feature_showcase: an H2 Feature Showcase with a linked preview image
    third_party_notices_section: an H2 Third-Party Notices
    license_notices_link: the License section links a notices or font-license file
    format_matrix: a table of formats against capabilities or load and save support
    choosing_edition: an H2 or H3 comparing the FOSS editions of one family
    result_images: screenshots of example output
    image_glance: At a Glance as an image instead of a Mermaid diagram
    maturity_notice: a stated pre-release maturity (alpha, pre-alpha, pre-release)
    install_warning: >-
      a bold warning in Installation that the published artifact differs from the source tree or
      carries a known security fix
    extra_reference_sections: H2 sections beyond the standard set that hold reference material
    collapsed_capability_reference: a collapsed block that extends Key Capabilities or Scope
    persona_tables: persona, workflow or buyer tables in place of capability bullets
    provenance_story: a section telling where the code came from
    cli_reference: command-line usage documented as its own section
    mcp_section: an H2 documenting an MCP server
    no_aspose_product_pages: >-
      the family has no Aspose product, documentation or reference pages yet, so the README
      carries no Aspose link, banner or Enterprise Edition paragraph (LNK-11)

elements:
  - id: identity_h1
    heading: null
    order: 1
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: Exactly one H1, the complete canonical product name.
    observations: [h1_exactly_one, h1_canonical_name]
    forms:
      - "# Aspose.<Family> FOSS for <Platform>"
      - "package slug, dotted or hyphenated variants (Font, PSD .NET, PSD Python)"
    preferred_form: "# Aspose.<Family> FOSS for <Platform>, exactly as the registry names it"
  - id: badge_row
    heading: null
    order: 2
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: One badge paragraph under the H1; images only, each backed by a verified target.
    observations: [badge_row_present, badge_row_single_paragraph, badge_license, badge_package,
      badge_runtime, badge_ci, badge_contributors, badge_order_ok]
    forms:
      - shields.io badges, one paragraph, separated by spaces or line breaks without a blank line
      - the GitHub Actions workflow badge for a real build status
      - the pkg.go.dev badge for Go
    preferred_form: >-
      package or release, runtime floor, build status, license, contributors, in that order, each
      only when its target is verified
  - id: banner
    heading: null
    order: 3
    structure: inherited
    requirement: optional
    basis: [OBSERVED_VARIANT]
    summary: >-
      A linked product banner between the badge row and the opening: one image whose single link
      goes to products.aspose.org/{family}/{platform}/, correct and not promotion (owner ruling R1).
    observations: [banner_present, banner_image_on_products_org, banner_links_to_aspose,
      aspose_link_before_opening]
    forms:
      - "[![Aspose.<Family> FOSS for <Platform>](https://products.aspose.org/media/<family>/<platform>/banner-readme.png)](https://products.aspose.org/<family>/<platform>/)"
    preferred_form: preserved exactly when the live README has it; never added (OD-01)
  - id: opening
    heading: null
    order: 4
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      Two to four sentences that start with the product name and say what it is and does, with
      its real entry-point types, before any promotion.
    observations: [opening_present, opening_starts_with_product, opening_free_open_source,
      opening_names_license, opening_audience_phrase, opening_two_to_four_sentences]
    forms:
      - "<Product> is a free, open-source, MIT-licensed <language> library for <verbs> ..."
      - "negative-scope second sentence (PSD, Slides): 'It is not a renderer ...'"
    preferred_form: the live opening, corrected only where a claim in it is false
  - id: navigation
    heading: Navigation
    order: 5
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: A flat list of in-page links to every H2 of the document, in document order.
    observations: [navigation_present, navigation_complete, navigation_before_glance]
    forms:
      - "H2 Navigation + one bullet per H2"
      - "auto-generated nested table of contents (Cells-Go)"
    preferred_form: flat bullet list, every H2, document order, placed after the opening
  - id: at_a_glance
    heading: At a Glance
    order: 6
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      A Mermaid flowchart: Starting Points, the product, Core Capabilities, Outputs. The three
      mother blocks run left to right and each is split by key capability, Core included; every
      box grows with its text so no label is clipped (owner ruling R7); nothing else in the
      section.
    condition: at least three verified core capabilities
    observations: [glance_present, glance_mermaid, glance_starting_points, glance_core_capabilities,
      glance_outputs_group]
    forms:
      - "flowchart with subgraphs Starting Points, Core Capabilities (nested columns), Outputs, in the direction the live README draws it (a top-to-bottom direction stacks the mother blocks, DEF-30)"
      - image only (PDF .NET)
    preferred_form: >-
      the Mermaid topology of plans/idea.md with the three mother blocks left to right, each split
      by key capability, boxes grown to their text, verified by a real render (STR-28)
  - id: key_capabilities
    heading: Key Capabilities
    order: 7
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: A bulleted list of what the library does, each bullet naming the real types it rests on.
    observations: [key_capabilities_present, capabilities_3_to_8, capabilities_over_12]
    forms:
      - verb-led bullets with backticked API names, one to four lines each
      - bold lead-in phrase, a dash, then the detail
      - capability tables (Font) and 'What it can do' lists (Slides .NET, Words .NET)
    preferred_form: the live list; only a false or missing item is corrected or added
  - id: installation
    heading: Installation
    order: 8
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      Every idiomatic install form of the ecosystem, then supported runtimes; when unpublished,
      the source install and a plain statement that no package exists.
    observations: [installation_present, install_registry_command, install_source_clone,
      install_native_build, install_says_unpublished]
    forms:
      - dotnet add package plus a PackageReference block (.NET)
      - Maven dependency block plus Gradle Groovy or Kotlin (Java)
      - pip install, quoted when versioned (Python)
      - go get with the versioned module path (Go)
      - git clone then build, editable install, or ProjectReference (source only)
      - CMake add_subdirectory, FetchContent or find_package, plus a NuGet package for Windows (C++)
    preferred_form: the live forms, each command verified against the manifest and the registry
  - id: dependencies
    heading: Dependencies
    order: 9
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      Dependency buckets from the manifest: Required Package Dependencies, Optional Dependencies,
      Native and System Requirements, Development Dependencies.
    observations: [dependencies_present, deps_required_h3, deps_optional_h3, deps_native_h3,
      deps_development_h3, deps_zero_sentence]
    forms:
      - "H3 buckets under H2 Dependencies"
      - "'No required third-party package dependencies.' for a verified-empty bucket"
      - a 'Requirements' table (Slides .NET)
    preferred_form: H3 buckets from the manifest, verified-empty stated, never omitted silently
  - id: quick_start
    heading: Quick Start
    order: 10
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: One to three minimal examples that compile or run, each with a lead-in sentence.
    condition: at least one example verified at this revision
    observations: [quick_start_present, quick_start_one_to_three_examples]
    forms:
      - one fenced example after Dependencies
      - two examples, create then open
    preferred_form: the live examples; a failing one is fixed or removed with evidence
  - id: feature_showcase
    heading: Feature Showcase
    order: 11
    structure: inherited
    requirement: optional
    basis: [OBSERVED_VARIANT]
    summary: A linked preview image of a repository-owned asset that proves a capability.
    observations: [feature_showcase_section]
    forms: ["[![alt](preview.png)](docs/showcase.pdf) between Quick Start and Additional Examples"]
    preferred_form: preserved when present, never generated
  - id: additional_examples
    heading: Additional Examples
    order: 12
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      A lead-in, one visible flagship example, and a collapsed block of further task-named
      examples.
    observations: [additional_examples_present, additional_examples_collapsed,
      additional_examples_task_named]
    forms:
      - "<details><summary>View Additional Examples</summary> with one H3 per task"
    preferred_form: the live examples, task-named headings, one collapsed block
  - id: project_structure
    heading: Project Structure
    order: 13
    structure: inherited
    requirement: optional
    basis: [OBSERVED_VARIANT]
    summary: A fenced directory tree of the repository, kept current with the tree.
    observations: [project_structure_section]
    forms: [an H2 with a language-less fenced tree and a one-line intro]
    preferred_form: preserved; paths verified against the tree; fence language text
  - id: api_reference
    heading: API Reference
    order: 14
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      A short visible intro naming the entry-point types and the type count, then the complete
      public surface collapsed in a details block: Class | Description tables and a Detailed
      Member Reference.
    condition: the repository exposes a public API
    observations: [api_present, api_collapsed, api_summary_view_prefix, api_summary_view_supported,
      api_class_description_table, api_member_reference, api_states_type_count]
    forms:
      - "<details><summary>View the Supported Public API Surface</summary> (the most common of seven wordings)"
      - one Class | Description table per kind or module
    preferred_form: the live block; counts, rows and descriptions corrected against the symbols
  - id: docs_resources
    heading: Documentation & Resources
    order: 15
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      Getting started guide, How-to guides & FAQ and Full API reference on the Aspose sites,
      repository files that help a reader, and an Open an issue item.
    observations: [docs_present, docs_trio, docs_getting_started_guide, docs_how_to_guides_faq,
      docs_full_api_reference, docs_open_issue, docs_repo_relative, issues_link]
    forms:
      - three bold or plain links to docs.aspose.org, kb.aspose.org, reference.aspose.org
      - repository-relative links to PUBLISHING.md, CHANGELOG.md, docs/ guides, workflow files
    preferred_form: the live list; verified Aspose targets added when missing
  - id: scope_limitations
    heading: Scope and Limitations
    order: 16
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      Bulleted designed or declared limitations, each naming the mechanism, closed by the
      Enterprise Edition paragraph.
    observations: [scope_present]
    forms:
      - bullets, from two to dozens, each one limitation
      - bold-lead limitation bullets (PSD, Slides)
    preferred_form: the live bullets; a bullet the code contradicts is corrected, never silently dropped
  - id: enterprise_paragraph
    heading: null
    order: 17
    structure: core
    requirement: conditional
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: >-
      The final paragraph of Scope and Limitations: one to three sentences relating the FOSS scope
      to the Enterprise Edition, with one link to the verified product page.
    condition: a verified aspose.com product target exists for the family and platform
    observations: [enterprise_in_scope_when_aspose_linked, enterprise_in_scope,
      enterprise_closes_scope, enterprise_once, enterprise_dont_apply, enterprise_apply_only,
      enterprise_see_for, enterprise_full_featured_anchor]
    forms:
      - "These limitations don't apply to [Aspose.<Family> for <Platform> — Enterprise Edition](url), which adds ..."
      - "These limitations apply only to <FOSS product> — they don't carry over to [..], which adds ..."
      - "For <needs>, see [..], which adds ..."
    preferred_form: >-
      the live sentence shape; anchor 'Aspose.<Family> for <Platform> — Enterprise Edition' (the
      family alone when the verified target is the family page), target verified against
      product-page facts
  - id: development_testing
    heading: Development and Testing
    order: 18
    structure: core
    requirement: expected
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: Build and test commands from the repository's own files, never collapsed.
    observations: [devtest_present]
    forms:
      - prose with fenced build and test commands, a CI matrix sentence and a release workflow link
    preferred_form: the live section; commands verified against the build files
  - id: third_party_notices
    heading: Third-Party Notices
    order: 19
    structure: core
    requirement: conditional
    basis: [OBSERVED_VARIANT, OWNER_RULE]
    summary: A visible heading with a repository-relative link to the notices file.
    condition: a third-party notices file exists in the tree
    observations: [third_party_section]
    forms:
      - an H2 Third-Party Notices (PDF Go, PDF C++)
      - a link from the License section (Note, Cells Python, TeX)
    preferred_form: link text in normal style, not code style
  - id: license
    heading: License
    order: 20
    structure: core
    requirement: required
    basis: [OBSERVED_COMMON, OWNER_RULE]
    summary: A prose declaration of the license with a repository-relative link, never a bare link.
    observations: [license_present, license_prose, license_permissions_sentence,
      license_copyright_line]
    forms:
      - "This project is licensed under the [MIT License](LICENSE). The MIT License permits use, copying, modification, distribution, sublicensing, and commercial use, provided its copyright and permission notice are retained. The software is provided without warranty."
    preferred_form: the live sentence; a bare link or a copyright line is corrected

rules:
  # ---- principles
  - id: PRC-01
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      The live README of the exact upstream revision is the structural authority: its heading
      skeleton, section order, tone, prose structure and links are preserved (owner ruling R4:
      plans/idea.md no longer says the template owns tone and headings).
    detector: "NEW: skeleton diff of candidate against live (headings, levels, order); every difference carries an edit record"
    owner_ref: "directive 2026-10-11; owner ruling R4 (OD-04), 2026-10-11"
  - id: PRC-02
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      Exactly three operations are allowed: correct what is verified false, add verified
      information the README lacks, improve where measurably better. Anything else is not done.
    detector: "NEW: edit ledger; each hunk is typed CORRECT, ADD or IMPROVE with its evidence"
    owner_ref: "directive 2026-10-11"
  - id: PRC-03
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      A change set is accepted only if it is a Pareto improvement over the live README on the
      measure vector of section 5.1: no defect count rises, no verified element is lost, and at
      least one measure strictly improves.
    detector: "NEW: baseline-relative validation (run each BC and text predicate on live and candidate; no new failure)"
    owner_ref: "directive 2026-10-11 ('do better than what is currently live')"
  - id: PRC-04
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      Every edit ships with machine-reproducible evidence: compiler output, registry answer, tree
      path, grep line or predicate. Without it the finding becomes an issue or an advisory, not an
      edit.
    detector: "NEW: edit ledger validation; existing facts, receipts and BC-02, BC-03, BC-14"
    owner_ref: "plans/idea.md L338-347; AGENTS.md Truth and README Content"
  - id: PRC-05
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      Valuable maintainer content is never removed: verified prose, examples, links, badges,
      limitations, capabilities, terminology and warnings stay unless a verified cause names them.
    detector: "existing: BC-05 and BC-08 (extended to prose, links and badges); NEW: live-floor check"
    owner_ref: "plans/idea.md L338-347"
  - id: PRC-06
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      No change is a valid outcome. A README with no verified defect and no verified gap yields an
      empty patch; a cosmetic-only change never justifies a pull request.
    detector: "NEW: empty-patch fast path; existing no-op proof (BC-11)"
    owner_ref: "plans/idea.md L319-321"
  - id: PRC-07
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      Only a repository with no README may be authored from scratch, from the standard skeleton
      and verified facts; a README or license-only placeholder returns insufficient_evidence.
    detector: "existing: insufficient_evidence outcome in cli.py; NEW: greenfield gate"
    owner_ref: "AGENTS.md Truth and README Content"
  - id: PRC-08
    element: document
    basis: [OBSERVED_VARIANT, OWNER_RULE]
    severity: blocking
    statement: >-
      A README that documents a source tree ahead of the published artifact says so, as Slides
      Java, Slides Python and Cells Go already do; the correction keeps the distinction and
      marks main-only features as unreleased instead of flattening to head.
    detector: "NEW: published-versus-head claim model (registry versions against the tag diff)"
    owner_ref: "survey: Slides Java, Slides Python and Cells Go separate release from main (OD-08)"

  - id: PRC-09
    element: document
    basis: [OWNER_RULE]
    severity: blocking
    statement: >-
      The baseline of every iteration is the live README at the head the candidate is built
      against. A merged correction becomes the next baseline; the next iteration must beat it
      again or produce an empty patch, and it never reverts an accepted edit without a new
      verified cause.
    detector: "existing: BC-01 source revision pinned; NEW: prior accepted edits kept in the ledger and checked for reversal"
    owner_ref: "directive 2026-10-11 ('with every iteration')"

  # ---- structure and composition
  - id: STR-01
    element: identity_h1
    basis: [OBSERVED_COMMON, OWNER_RULE]
    severity: blocking
    statement: >-
      Exactly one H1 holding the complete canonical product name; a second H1 and a package or
      namespace shorthand are corrected.
    detector: "existing: text_checks.single_h1, BC-07, BC-12"
    observations: [h1_exactly_one, h1_canonical_name]
    owner_ref: "plans/idea.md L75, L81-85"
  - id: STR-02
    element: badge_row
    basis: [OBSERVED_COMMON, OWNER_RULE]
    severity: blocking
    statement: One badge row, one paragraph under the H1; never duplicated, split or fabricated.
    detector: "existing: text_checks.single_badge_row, BC-07"
    observations: [badge_row_present, badge_row_single_paragraph]
    owner_ref: "plans/idea.md L75-78"
  - id: STR-03
    element: badge_row
    basis: [OBSERVED_VARIANT]
    severity: advisory
    statement: >-
      Badge contents follow the product: a license badge whenever a license file exists, a
      package badge only when the registry lists the package, a runtime floor from the manifest, a
      build badge only for a push-triggered workflow, contributors optional. A missing badge with
      a verified target is added; an unverified one is removed.
    detector: "existing: BC-07 badge support check, evidence/facts/assets.py link_target:badge.ci"
    observations: [badge_license, badge_package, badge_runtime, badge_ci, badge_contributors]
  - id: STR-04
    element: badge_row
    basis: [OWNER_RULE]
    severity: advisory
    statement: >-
      Badge order is package, runtime, build status, license, contributors. It governs badges the
      change adds; an existing row is reordered only when the row is already changing for another
      reason.
    detector: "existing: BC-07 order check (to be made baseline-relative); NEW: survey_features.badge_order_ok"
    observations: [badge_order_ok]
    owner_ref: "plans/idea.md L75-76; owner ruling R6 (OD-05), 2026-10-11"
  - id: STR-05
    element: banner
    basis: [OBSERVED_COMMON, OBSERVED_VARIANT]
    severity: advisory
    statement: >-
