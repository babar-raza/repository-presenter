# Unattended upstream-issue management (components/issues/; docs/investigations/03-issue-tracking.md).
#
# Each scheduled run fans out over every repository that has a HANDOFF_PENDING or FILED handoff
# under evidence/upstream-defects/ (`repository-presenter issue-targets`, the matrix below). The
# matrix is selected by the ledger, never by the registry; whether a leg may write is decided by the
# registry write gate (core/registry/write_gate.py), which consults the entry's `issues_mode`
# (file permits; absent, it derives from `mode`: full -> file, otherwise dry_run) and never `mode`
# alone, so an entry can be issue-eligible while its README pull requests stay refused. Per
# target repository:
#
#   analyse (always; read-only). A read token scoped to that one repository (contents, issues and
#     metadata: read) runs the dry runs - `file-upstream-defects` (what would be filed, or is already
#     filed upstream) and `redetect-upstream-defects` (what would be closed) - and publishes the
#     report as a step summary and a run artifact. No write credential exists in this job.
#
#   file-and-close (gated twice). Runs only while the kill switch is on: the repository variable
#     REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED is 1 (Settings > Secrets and variables > Actions >
#     Variables). The kill switch can stop every write; it never authorizes one. A handoff is filed
#     only when the owner has committed an approval record for that exact handoff
#     (ops/issue_approvals/<handoff-id>.json; its target, evidence digest and expiry are verified
#     by components/issues/approval.py, read from the commit this run was triggered on). The job
#     counts such handoffs first and mints the issues-write token, scoped to that one repository,
#     only when the count is nonzero. Closing a filed issue needs its own, separate approval record
#     (ops/issue_close_approvals/<handoff-id>.json: the exact issue number and the close reason,
#     expiring), the registry entry's issues_mode file, a write token verified to be an installation token
#     scoped to that one repository, and the fingerprint marker on the live issue; the same count
#     includes FILED handoffs only when such a close approval is on record. The token is handed only
#     to the two gated steps below as GH_ISSUES_WRITE_TOKEN, and the literal switch value "1" is
#     set on those same two steps and nowhere else, so the reviewer sees the switch and the GitHub-mutating step as one.
#     No job holds contents: write and checkout persists no credential, so a run cannot commit
#     the approval it would consume.
#
# Least privilege (AGENTS.md "Security and Effects"): the top-level grant is contents: read; every
# mint names exactly the permissions its job uses and exactly one repository (tests/
# test_workflow_app_tokens.py pins this); checkout does not persist the checkout token; and no
# step ever sees a write token unless the gate variable is set.
#
# Bounded and paced (TC-ISS-09/11): per target repository the filing step files at most
# --daily-cap issues per UTC day and none while --open-cap of this system's issues are open there,
# counted from the target repository itself (the issues carrying the fingerprint marker), so a
# second run the same day cannot exceed them; successive writes of one run are --pace-seconds
# apart. A create whose response was lost is reconciled by searching for the marker before any
# second POST (components/issues/file.py). Raising a cap is a reviewed change to this file.
#
# Dedup across runs: this workflow does not commit handoff status back to the repository. Instead
# the body of every filed issue carries the handoff's fingerprint marker, and each filing first
# searches the target for that marker (components/issues/file.py). A fresh checkout therefore
# cannot file the same defect twice. A search that cannot complete refuses the filing rather than
# assuming it is absent.
#
# Failure isolation: fail-fast is off, so one target's failure (for example, the App not installed
# on its owner) fails only that leg and never stops another target.
name: Upstream issues (scheduled)

on:
  schedule:
    # Daily, off the top of the hour.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-issues
  cancel-in-progress: false

jobs:
  targets:
    name: Enumerate upstream-defect targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      # Full history: a handoff's age is when git first saw its file.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - id: targets
        name: Repositories with a pending or filed handoff (compact JSON)
        run: echo "matrix=$(repository-presenter issue-targets)" >> "$GITHUB_OUTPUT"

      # The issue funnel (PENDING, APPROVED, FILED, RESOLVED) and a warning annotation for every
      # handoff waiting on the owner longer than the limit. Offline: no credential, no network.
      - name: Issue funnel and aged handoffs
        run: repository-presenter issue-funnel --max-pending-days 14

  analyse:
    name: Analyse ${{ matrix.target.repo }} (read-only)
    needs: targets
    if: ${{ needs.targets.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      # Full history: an approval record's introducing commit must be identifiable.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # Read-only, repository-scoped. Metadata is the minimum every installation token carries;
      # contents is the recheck's own file reads; issues finds an existing marker upstream.
      - name: Mint a read token scoped to this target repository
        id: read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.name }}
          permission-contents: read
          permission-issues: read
          permission-metadata: read

      # The kill switch is mirrored (as its value, never a literal) only so the report can say
      # whether the write job would run; this job holds no write token and uses no --file.
      - name: Dry run - what would be filed and what would be closed (no write credential here)
        env:
          REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED: ${{ vars.REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED }}
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ matrix.target.repo }}
          APPROVALS_REF: ${{ github.sha }}
        run: |
          report="$RUNNER_TEMP/issue-report.txt"
          rc=0
          repository-presenter file-upstream-defects --repo "$REPO" --approvals-ref "$APPROVALS_REF" > "$report" 2>&1 || rc=$?
          repository-presenter redetect-upstream-defects --repo "$REPO" --approvals-ref "$APPROVALS_REF" --resume-out "$RUNNER_TEMP/resume-contract.json" >> "$report" 2>&1 || rc=$?
          cat "$report"
          {
            echo "### ${REPO} (dry run, read-only)"
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the dry-run report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-report-${{ matrix.target.owner }}__${{ matrix.target.name }}
          path: ${{ runner.temp }}/issue-report.txt
          if-no-files-found: warn

      # The lifecycle's hand-off to sealing (core/sealing_plan.py::read_resume_contract): the
      # repositories whose blocking upstream defect is resolved, so the candidate it blocked is
      # planned again whatever the drift monitor says. A run artifact only; nothing is written.
      - name: Keep the resume contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resume-contract-${{ matrix.target.owner }}__${{ matrix.target.name }}
          path: ${{ runner.temp }}/resume-contract.json
          if-no-files-found: ignore

  file-and-close:
    name: File and close ${{ matrix.target.repo }} (owner-gated write)
    needs: targets
    if: ${{ vars.REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED == '1' && needs.targets.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      # Full history: an approval record's introducing commit must be identifiable.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # Committed files only, no network and no credential: how many handoffs for this target hold
      # a valid owner approval (plus FILED ones awaiting a possible close).
      # While the owner has enabled update comments, a FILED handoff is also something this job
      # may act on (an update comment), so it counts without a close approval.
      - name: Count handoffs this job may act on (approval records, read from this commit)
        id: approvals
        env:
          REPOSITORY_PRESENTER_ISSUES_COMMENTS_AUTHORIZED: ${{ vars.REPOSITORY_PRESENTER_ISSUES_COMMENTS_AUTHORIZED }}
          REPO: ${{ matrix.target.repo }}
          APPROVALS_REF: ${{ github.sha }}
        run: |
          extra=""
          if [ "$REPOSITORY_PRESENTER_ISSUES_COMMENTS_AUTHORIZED" = "1" ]; then extra="--with-updates"; fi
          echo "count=$(repository-presenter file-upstream-defects --repo "$REPO" --approvals-ref "$APPROVALS_REF" --count-writable $extra)" >> "$GITHUB_OUTPUT"

      - name: Mint a read token scoped to this target repository
        if: ${{ steps.approvals.outputs.count != '0' }}
        id: read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.name }}
          permission-contents: read
          permission-issues: read
          permission-metadata: read

      # Write-scoped and separate from the read token: issues only, this one repository only. It is
      # referenced by the two gated steps below and by no other step in this workflow.
      - name: Mint an issues-write token scoped to this target repository
        if: ${{ steps.approvals.outputs.count != '0' }}
        id: write-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.name }}
          permission-issues: write
          permission-metadata: read

      - name: "File approved handoffs (kill switch REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED=1 set here only)"
        if: ${{ steps.approvals.outputs.count != '0' }}
        env:
          REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED: "1"
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_ISSUES_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          REPO: ${{ matrix.target.repo }}
          APPROVALS_REF: ${{ github.sha }}
        run: >-
          repository-presenter file-upstream-defects --repo "$REPO" --file
          --approvals-ref "$APPROVALS_REF"
          --daily-cap 3 --open-cap 5 --pace-seconds 10

      # A close is a write to a product repository and is gated like a filing and more: the registry
      # entry must be mode full, the owner must have committed a close approval naming this exact
      # issue number and close reason (ops/issue_close_approvals/<handoff-id>.json), the write token
      # is verified to be an installation token scoped to this one repository, and the live issue
      # must carry this handoff's fingerprint marker. Any gate failing leaves the issue untouched.
      - name: "Close approved issues whose defect is proven resolved (gated: kill switch, close approval, registry, token provenance)"
        if: ${{ steps.approvals.outputs.count != '0' }}
        env:
          REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED: "1"
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_ISSUES_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          REPO: ${{ matrix.target.repo }}
          APPROVALS_REF: ${{ github.sha }}
        run: repository-presenter redetect-upstream-defects --repo "$REPO" --close --approvals-ref "$APPROVALS_REF"

      # Evidence changed on a filed issue: one update comment, never a second issue and never a
      # repeat (components/issues/lifecycle.py keeps it idempotent through a marker on the
      # comment). Gated like a filing, and additionally by the owner's separate comments switch,
      # which is only ever mirrored here (its value), never set by the workflow.
      - name: "Update filed issues whose evidence changed (gated: kill switch, comments switch, registry, token provenance, live issue marker)"
        if: ${{ steps.approvals.outputs.count != '0' }}
        env:
          REPOSITORY_PRESENTER_ISSUES_WRITE_AUTHORIZED: "1"
          REPOSITORY_PRESENTER_ISSUES_COMMENTS_AUTHORIZED: ${{ vars.REPOSITORY_PRESENTER_ISSUES_COMMENTS_AUTHORIZED }}
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_ISSUES_WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
          REPO: ${{ matrix.target.repo }}
          APPROVALS_REF: ${{ github.sha }}
        run: repository-presenter redetect-upstream-defects --repo "$REPO" --comment --approvals-ref "$APPROVALS_REF"
