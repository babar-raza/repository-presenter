name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install uv (lock regeneration only - never a runtime or dev dependency itself)
        # Pinned, not left to float: a live PR #170 failure proved uv's own marker-simplification
        # (confirmed, not assumed - scripts/check_lock_drift.sh's own header comment has the detail)
        # can legitimately differ by version/host-interpreter combination even under --universal,
        # so an unpinned "latest uv" would make this gate itself non-reproducible across reruns.
        run: python -m pip install --disable-pip-version-check "uv==0.12.21"

      - name: Verify requirements-lock.txt has no drift (G7-W02)
        id: lockdrift
        continue-on-error: true
        run: bash scripts/check_lock_drift.sh

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Install pip-audit (SBOM/audit tool, never a runtime or dev dependency of the project itself)
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: SBOM and vulnerability audit (G7-W02)
        id: sbom
        continue-on-error: true
        run: |
          mkdir -p evidence/sbom
          python -m pip_audit -r requirements-lock.txt -f cyclonedx-json -o evidence/sbom/requirements-lock.cdx.json --timeout 60
          python -m pip_audit -r requirements-lock.txt -s osv -f json --timeout 60 | tee /tmp/pip-audit-osv.json
          python -m pip_audit -r requirements-lock.txt -s osv -f markdown --timeout 60 > /tmp/pip-audit-osv.md
          python - <<'PY'
          import json, sys

          with open("/tmp/pip-audit-osv.json") as f:
              report = json.load(f)

          # pip-audit's own JSON has no severity field (OSV's severity data is inconsistent across
          # advisories); every finding it reports is therefore treated as high-severity for this
          # gate's own purpose - "fails on a new high-severity finding" - rather than silently
          # under-reacting to a finding this tool chose not to score. A future, better-scored
          # source should replace this blanket rule, not be assumed to exist today.
          vulnerable = [dep for dep in report["dependencies"] if dep["vulns"]]
          if vulnerable:
              print("VULNERABILITIES FOUND - failing the gate (G7-W02 acceptance: fail on a new "
                    "high-severity finding; pip-audit's own JSON carries no severity field, so "
                    "every genuine finding is treated as high-severity rather than assumed benign):")
              for dep in vulnerable:
                  for vuln in dep["vulns"]:
                      print(f"  {dep['name']}=={dep['version']}: {vuln['id']} - {vuln.get('fix_versions')}")
              sys.exit(1)
          print(f"No known vulnerabilities across {len(report['dependencies'])} resolved packages (OSV).")
          PY

      - name: Upload SBOM and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-vulnerability-audit-py${{ matrix.python-version }}
          path: |
            evidence/sbom/requirements-lock.cdx.json
            /tmp/pip-audit-osv.json
            /tmp/pip-audit-osv.md
          if-no-files-found: warn

      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check .

      - name: Format
        id: format
        continue-on-error: true
        run: ruff format --check .

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: mypy src

      # The C++ example verifier (src/repository_presenter/components/readme/extractors/platforms/
      # cpp_examples.py) probes g++, cmake and ninja from PATH and its tests assert the CMake build
      # itself ran. A hosted ubuntu-latest image happens to ship cmake and ninja, but a local act
      # image does not, so the toolchain is declared here rather than inherited from the runner image
      # (the same explicit provisioning present.yml uses for the same verifier).
      - name: GCC, CMake and Ninja for the C++ example verifier (g++, cmake, ninja)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      - name: Unit tests, schema validation, canary, and path budget
        id: pytest
        continue-on-error: true
        run: pytest

      - name: Official entry point
        id: entrypoint
        continue-on-error: true
        run: |
          repository-presenter --version
          repository-presenter status

      # Each step above runs independently (continue-on-error) so one broken gate never hides
      # whether the others - especially the test suite - actually pass. This summary is the one
      # place the job's real pass/fail comes from (2026-09-09, docs/CI_AND_STALENESS_ASSESSMENT.md
      # section 2.3: a fail-fast pipeline had made every CI run "red" mean nothing more specific
      # than "something is wrong," hiding whether the test suite itself passed on Linux for
      # potentially the whole prior healing pass).
      - name: Summary
        if: always()
        run: |
          echo "lockdrift: ${{ steps.lockdrift.outcome }}"
          echo "sbom: ${{ steps.sbom.outcome }}"
          echo "lint: ${{ steps.lint.outcome }}"
          echo "format: ${{ steps.format.outcome }}"
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "pytest: ${{ steps.pytest.outcome }}"
          echo "entrypoint: ${{ steps.entrypoint.outcome }}"
          if [ "${{ steps.lockdrift.outcome }}" != "success" ] ||
             [ "${{ steps.sbom.outcome }}" != "success" ] ||
             [ "${{ steps.lint.outcome }}" != "success" ] ||
             [ "${{ steps.format.outcome }}" != "success" ] ||
             [ "${{ steps.typecheck.outcome }}" != "success" ] ||
             [ "${{ steps.pytest.outcome }}" != "success" ] ||
             [ "${{ steps.entrypoint.outcome }}" != "success" ]; then
            echo "One or more checks failed - see the outcomes above for exactly which."
            exit 1
          fi
