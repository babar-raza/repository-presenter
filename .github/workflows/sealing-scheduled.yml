# Unattended sealing and README refresh (G7-W06 work item 3; plans/idea.md Operating Model;
# docs/EXECUTION_STATE_MACHINE.md G7). One scheduled run:
#
#   plan   read-only. Reads the drift monitor's output file (drift/drift.json, the contract in
#          core/sealing_plan.py), keeps only DRIFTED, enabled, registry-listed repositories, sorts
#          them, and takes at most three (MAX_REPOSITORIES_PER_RUN). Refuses any run whose prompt
#          manifests or GPT_OSS_MODEL name a model other than qwen3-next.
#          Pause switch: when the repository variable REPOSITORY_PRESENTER_SEALING_PAUSED is exactly
#          "1", it reports has_work=false and has_publishable=false with the notice "sealing
#          paused by owner variable" (also written to the step summary) before reading anything,
#          so no seal or propose leg starts. Unset, empty or any other value leaves sealing
#          enabled: autonomy by default, and the cap of three per run bounds the daily spend.
#   seal   one matrix leg per planned repository, strictly one at a time (max-parallel 1), each
#          calling present.yml via workflow_call - the one reusable pipeline, never a copy. Analysis
#          there uses a read-only, repository-scoped App token. fail-fast is off: one repository's
#          failed seal never stops the others.
#   propose  one matrix leg per planned repository whose registry mode is "full" (mode governs
#          publication readiness; a dry_run repository is sealed but never proposed), calling
#          propose.yml via workflow_call with
#          candidate_artifact set, so it proposes only the bundle this run just sealed and exported,
#          and only when that bundle is READY_FOR_PROPOSAL. The write token is minted inside
#          propose.yml's own `write` job, never in plan or seal. The whole job runs only when the
#          owner variable REPOSITORY_PRESENTER_PROPOSAL_WRITE_AUTHORIZED is exactly "1" (set by the
#          owner in the repository's Actions variables; never inferred from credential presence).
#          Unset, this workflow is read-only observation: it plans and seals and writes nothing to
#          any target.
#
# Nothing is written or proposed to a target unless ALL of these hold, each checked independently
# and none created by this workflow: the registry write gate permits (entry listed, active, mode
# "full"); an authorization record for exactly the sealed candidate (ops/proposal-authorizations/
# <owner>__<name>__<candidate hash prefix>.json) that a person reviewed and merged to origin/main
# before this run's trigger commit (propose.yml passes --authorization-record and --trigger-sha and
# checks out full history; a refusal exits 3 and writes nothing); the owner variable above; and the
# command's own recheck that the target's live revision still matches. No step here or in
# propose.yml runs git commit or push, and no job writes to any branch of this repository; the only
# write other than the gated target proposal is present.yml's durable-state refs in this repository.
#
# No model is configured anywhere in this file: sealing runs on qwen3-next alone, the route each
# prompt manifest declares (owner rule; core/sealing_plan.py refuses any other). GPT_OSS_MODEL is
# never set here.
#
# Dependency, stated plainly: this workflow depends on the drift monitor (monitor.yml, G7-W06) only
# through its evidence, handed over as artifacts. A monitor run writes no file that outlives its own
# run, so the plan job itself downloads the drift-* artifacts of the LATEST SUCCESSFUL monitor run on
# main (gh run list/download, actions: read) and assembles them into the one sealing contract file,
# drift/drift.json (repository-presenter monitor-drift-contract, components/monitor/drift.py). That
# assembly fails closed on no evidence, partial evidence for an enabled owner or repository, or evidence
# older than 12 hours; an owner recorded NOT_INSTALLED is a notice, never zero drift.
#
# Least privilege, per job: plan and propose hold contents: read at the job level; seal holds
# contents: write only because present.yml's own durable-state refs live in this control repository
# (its analysis token is minted there, read-only). No job in this file mints an App token itself.

name: Sealing (scheduled)

on:
  schedule:
    # Daily, off the top of the hour, clear of monitor.yml's 17 */6 slots.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan this run (drifted, enabled, capped, qwen3-next only)
    runs-on: ubuntu-latest
    # actions: read only, so the plan job can download the monitor's evidence artifacts. No write.
    permissions:
      contents: read
      actions: read
    outputs:
      repositories: ${{ steps.plan.outputs.repositories }}
      has_work: ${{ steps.plan.outputs.has_work }}
      publishable: ${{ steps.plan.outputs.publishable }}
      has_publishable: ${{ steps.plan.outputs.has_publishable }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # The latest successful monitor run's evidence, read-only. A run with no successful monitor, or
      # no artifacts, fails here: there is then no evidence to plan from (see the header).
      - name: Download the latest successful drift monitor run's evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow monitor.yml --branch main             --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::no successful drift monitor run on main; there is no drift evidence to plan from"
            exit 1
          fi
          echo "drift monitor run: $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'drift-*' --dir monitor

      # Assembles every owner's evidence into the contract; fails closed (exit 2) on any gap or staleness.
      - name: Assemble the drift contract from the monitor's evidence
        run: repository-presenter monitor-drift-contract monitor --out drift/drift.json

      # The contract is read through its file alone; the cap and ordering live in code.
      - name: Select this run's repositories from the drift monitor's output
        id: plan
        env:
          # The owner pause switch (see the header); the command compares it to exactly "1".
          REPOSITORY_PRESENTER_SEALING_PAUSED: ${{ vars.REPOSITORY_PRESENTER_SEALING_PAUSED }}
        run: repository-presenter sealing-plan --drift-file drift/drift.json --github-output "$GITHUB_OUTPUT"

  seal:
    name: Seal ${{ matrix.target.repository }} (qwen3-next)
    needs: plan
    if: ${{ needs.plan.outputs.has_work == 'true' }}
    # Concurrency: one group per target repository, cancel-in-progress false so a seal is never
    # cancelled mid-transaction; plan is not grouped because it spends no provider calls.
    concurrency:
      group: seal-${{ matrix.target.repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.repositories) }}
    permissions:
      # present.yml's own grant, for its durable-state refs in this control repository only.
      contents: write
    uses: ./.github/workflows/present.yml
    with:
      repository: ${{ matrix.target.repository }}
    secrets: inherit

  propose:
    name: Propose ${{ matrix.target.repository }} (write-gated)
    needs: [plan, seal]
    # !cancelled(): one repository's failed seal must not skip the others. Each leg proposes only if
    # its own seal exported a READY_FOR_PROPOSAL bundle (propose.yml's gate). The matrix holds only
    # registry mode "full" repositories (mode governs publication readiness). The owner variable is
    # the write gate: unset or any value but "1", this job does not run at all.
    if: ${{ !cancelled() && needs.plan.outputs.has_publishable == 'true' && vars.REPOSITORY_PRESENTER_PROPOSAL_WRITE_AUTHORIZED == '1' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.publishable) }}
    permissions:
      contents: read
    uses: ./.github/workflows/propose.yml
    with:
      repo: ${{ matrix.target.repository }}
      do_propose: true
      candidate_artifact: sealed-${{ matrix.target.slug }}
    secrets: inherit
