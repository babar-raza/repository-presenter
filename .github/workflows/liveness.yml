# Out-of-band liveness dead-man (PHASE1/F2, 2026-09-11).
#
# Why this exists: every supervision mechanism in this repository ran inside one chat session —
# watcher and watched died together on 2026-09-06 19:31 and nothing noticed for 4.5 days (PRs #29
# and #30 sat green and unmerged for 3 d 18 h). This workflow is the one supervisor that survives
# session death, machine reboot, and sleep. It DETECTS and fails loudly; it repairs nothing —
# recovery is a new supervisor session running tools/reviewer/procedure.md section 0.
#
# Read-only by design: no write permission, no repo mutation, ever.
#
# When this run is red (contract since 2026-10-04): only a failed liveness signal. That is either
# the observer being blind (the open-PR listing or the git refs cannot be read) or main having gone
# quiet during a declared sprint (plans/sprint/ACTIVE). Stale in-flight work is an OBSERVATION, not
# a failure: an open PR older than 30 minutes is normally a lane still working, and every red run
# from 2026-09-11 to 2026-10-04 was red only because of that observation. Stale PRs and stranded
# remote branches are therefore written as ::notice:: annotations and a step summary, so the list
# stays visible while the run stays green. Steps run in sequence, so a red observation step would
# also skip the health check after it; this is a second reason observations must not fail.
name: Liveness

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  # Measured 2026-09-11 (PHASE1): the schedule trigger went silent for 3h54m under sustained
  # push-triggered Actions load (dozens of CI matrix + mirror runs/hour) despite being 'active'
  # and never modified - GitHub documents that scheduled runs can be silently deprioritized
  # during high load on the same repo. Chaining off CI's own completion piggybacks on exactly
  # the traffic that was starving the cron trigger, instead of competing with it; schedule: stays
  # as the fallback for genuine silence (no CI traffic at all), which is the scenario a dead-man
  # most needs to catch.
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Observe open PRs older than 30 minutes (label-independent; notice, not failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merged lane PRs land ~3 minutes after CI turns green (measured norm, 27 of 29);
          # 30 minutes open is two orders of magnitude past it. Label 'hold' exempts a PR the
          # owner deliberately parks. PRs #29/#30 carried no lane label — never filter by label.
          #
          # A failed listing is a liveness failure (the observer is blind) and fails this step.
          # Stale PRs are notices. Parsing is in python, not a bash `read` over a tab-separated
          # list: bash treats tab as IFS whitespace, so an empty labels field collapsed and the
          # branch name landed in the empty slot (2026-10-04: every PR printed "()" as its branch).
          set -euo pipefail
          listing=$(gh pr list --state open --limit 200 --json number,createdAt,labels,headRefName)
          python3 - "$listing" <<'PY'
          import datetime as dt
          import json
          import os
          import sys

          prs = json.loads(sys.argv[1])
          now = dt.datetime.now(dt.timezone.utc)
          rows = []
          for pr in prs:
              created = dt.datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
              age_min = int((now - created).total_seconds() // 60)
              if age_min <= 30:
                  continue
              labels = {label["name"] for label in pr.get("labels", [])}
              branch = pr["headRefName"]
              if "hold" in labels:
                  status = "held (label hold)"
              else:
                  status = "stale: adopt or close (loop-prompt section 1.1)"
                  print(
                      f"::notice title=Stale open PR::PR #{pr['number']} ({branch}) is "
                      f"{age_min} min old with no 'hold' label; adopt or close it"
                  )
              rows.append(f"| #{pr['number']} | `{branch}` | {age_min} | {status} |")
          lines = [
              "### Open PRs older than 30 minutes",
              f"{len(prs)} open PR(s); {len(rows)} older than 30 minutes (observation only).",
          ]
          if rows:
              lines += ["", "| PR | branch | age (min) | status |", "|---|---|---|---|"] + rows
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Observe remote branches ahead of main and untouched for 12+ hours (notice, not failure)
        run: |
          # Stranded work is an observation like a stale PR: the run names it, a human decides.
          # A failed git read is a liveness failure and fails the step.
          set -euo pipefail
          now=$(date -u +%s)
          refs=$(git for-each-ref refs/remotes/origin --format '%(refname:short)')
          stranded=0
          while read -r ref; do
            case "$ref" in origin/main|origin/HEAD) continue ;; esac
            ahead=$(git rev-list --count "origin/main..$ref")
            [ "$ahead" -gt 0 ] || continue
            tip_age_h=$(( (now - $(git log -1 --format=%ct "$ref")) / 3600 ))
            if [ "$tip_age_h" -ge 12 ]; then
              echo "::notice title=Stranded remote branch::branch $ref is $ahead commit(s) ahead of main and untouched for ${tip_age_h}h; inspect, adopt or delete"
              stranded=$((stranded + 1))
            fi
          done <<< "$refs"
          line="$stranded remote branch(es) ahead of main and untouched for 12+ hours (observation only)."
          echo "$line"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '\n### Stranded remote branches\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Main inactivity while a sprint is active
        run: |
          # plans/sprint/ACTIVE exists only during a declared sprint (created by the sprint plan,
          # removed at closeout) — outside one, quiet main is normal and this check passes.
          # This is a real health signal: while a sprint is active, silent main means the executor
          # and supervisor may both be down. It stays red.
          test -f plans/sprint/ACTIVE || { echo "no active sprint; inactivity check skipped"; exit 0; }
          age_h=$(( ( $(date -u +%s) - $(git log -1 --format=%ct origin/main) ) / 3600 ))
          if [ "$age_h" -ge 4 ]; then
            echo "::error::main has been inactive ${age_h}h during an active sprint — executor and supervisor may both be down; run tools/reviewer/procedure.md section 0"
            exit 1
          fi
          echo "main last moved ${age_h}h ago — within the active-sprint threshold"
