# G6-W02 (project/state.yaml; docs/EXECUTION_STATE_MACHINE.md G6; docs/STATE_MACHINE.md sections
# 11-12): the one write-capable workflow that opens or updates repository-presenter's README-
# proposal pull request on a target repository. Separately authorized from `present.yml`/
# `monitor.yml` in every way that matters:
#
#   - trigger: workflow_dispatch only, with required inputs naming the exact target - never a
#     schedule, never implicit from another workflow's success (G7-W06 wires unattended proposing
#     only after this mechanism is observed stable, per EXECUTION_STATE_MACHINE.md G7).
#   - two jobs, two trust levels (docs/STATE_MACHINE.md section 12: analysis and proposal
#     execution are separate jobs):
#       `dry-run`  validates every dispatch input, then reports the plan and whether the committed
#                  authorization record would be accepted. It reads the target with a read-only
#                  installation token (contents + metadata read, minted for the one target) that
#                  only the dry-run step sees; it holds no write credential, and its GITHUB_TOKEN
#                  permission is `contents: read` for the checkout alone.
#       `write`    runs only when `dry-run` succeeded AND the dispatcher ticked `do_propose`. It is
#                  the only job that mints a write token, and that token is exposed to exactly one
#                  step - the one that runs `repository-presenter propose --propose`.
#   - shell-injection hardening: no `${{ inputs.* }}` (or any other attacker-influenced
#     expression) is ever interpolated into a `run:` script. Every dispatch input is passed through
#     `env:` and read as a quoted shell variable; the first step of `dry-run` rejects any value
#     outside a strict allow-pattern and echoes only the input's name, never its value (a value
#     echoed into the log could itself carry a workflow command). `write` receives only the
#     validated values, as `needs.dry-run.outputs.*`, and again only through `env:`.
#     tests/test_workflow_hardening.py pins all of this, for every workflow in this directory.
#   - concurrency: one run per target repository at a time (`cancel-in-progress: false`), so two
#     proposals for one target can never race on the one stable presenter branch.
#   - credential: the write credential is a repository-scoped GitHub App installation token minted
#     fresh inside `write` (`actions/create-github-app-token@v2`, GitHub's own official action -
#     preferred over hand-rolled JWT signing per AGENTS.md's battle-tested-solutions rule), scoped to
#     exactly the one target repository and to the minimum permissions the effect uses - never the
#     whole App installation, never a personal access token. It is exposed to the CLI as
#     `GH_PROPOSAL_WRITE_TOKEN` only. The dry run's read-only token is exposed as `GH_TOKEN` (the
#     analysis credential name `present.yml`/`monitor.yml` use) to the dry-run step only. Dependencies
#     are installed before either token exists, and checkout does not persist the job's own
#     GITHUB_TOKEN into .git/config.
#
# `REPOSITORY_PRESENTER_PROPOSAL_WRITE_AUTHORIZED=1` is set in the one "Propose for real" step below
# only - never at the job or workflow level - so a reviewer of this file can see directly that the
# owner's explicit go-ahead (AGENTS.md "Security and Effects": never inferred from credential
# presence alone) and the actual GitHub-mutating step are the same step, not two that could drift
# apart. The `dry-run` job always runs first and writes nothing - every dispatch prints the plan
# (candidate hash, source revision, branch, policy version) and the authorization decision before
# any write is even possible.
#
# The command (PR #241) proposes only a registry-admitted, `full`-mode repository's sealed
# READY_FOR_PROPOSAL candidate. `authorization_record` names the committed record under
# `ops/proposal-authorizations/`; the command verifies from git history that the record was merged to
# origin/main before this run's trigger commit (`--trigger-sha`, this run's own `github.sha`), so
# both checkouts are full-depth (`fetch-depth: 0`). A refused or unsafe outcome exits 3, which the
# steps below report as a clear "proposal refused" failure. docs/STATE_MACHINE.md section 12.1: the
# *first* live exercise against a real external target is owner-selected, never agent-selected.
name: Propose

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository (OWNER/NAME) - must be a registry-admitted full-mode repository; owner-selected for the first live exercise (docs/STATE_MACHINE.md 12.1)"
        required: true
        type: string
      base_branch:
        description: "Override the target's default branch; read live from GitHub when left blank"
        required: false
        type: string
      authorization_record:
        description: "Path to the committed authorization record, ops/proposal-authorizations/<name>.json; required when do_propose is checked"
        required: false
        type: string
      do_propose:
        description: "Leave unchecked for a dry run (report the plan and the authorization decision, write nothing). Check to attempt the real write."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One proposal run per target repository at a time. Never cancel a run already in flight: a write
# interrupted between the branch ref, the contents PUT and the pull request would leave the
# reconciliation to the next run. (GitHub keeps at most one *pending* run per group.)
concurrency:
  group: propose-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate and dry-run ${{ inputs.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.validate.outputs.owner }}
      name: ${{ steps.validate.outputs.name }}
      repo: ${{ steps.validate.outputs.repo }}
      base_branch: ${{ steps.validate.outputs.base_branch }}
      authorization_record: ${{ steps.validate.outputs.authorization_record }}
    steps:
      # First, before checkout or any install: nothing the dispatcher typed is used until it has
      # passed. Values arrive only through env: and are only ever expanded as quoted variables. The
      # error messages name the input and the rule, never the value.
      - name: Validate every dispatch input against a strict allow-pattern
        id: validate
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          INPUT_AUTHORIZATION_RECORD: ${{ inputs.authorization_record }}
          INPUT_DO_PROPOSE: ${{ inputs.do_propose }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::propose input '$1' rejected: $2"
            exit 1
          }

          # repo: OWNER/NAME. Owner: 1-39 alphanumerics with single interior hyphens. Name: 1-100 of
          # [A-Za-z0-9._-], not leading '-', not '.' or '..'.
          owner_re='^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$'
          name_re='^[A-Za-z0-9._][A-Za-z0-9._-]{0,99}$'
          [[ "$INPUT_REPO" == */* ]] || fail repo "must be OWNER/NAME"
          owner="${INPUT_REPO%%/*}"
          name="${INPUT_REPO#*/}"
          [[ "$owner" =~ $owner_re ]] || fail repo "owner is not a valid GitHub owner name"
          [[ "$name" =~ $name_re ]] || fail repo "name is not a valid GitHub repository name"
          [ "$name" != "." ] && [ "$name" != ".." ] || fail repo "name is not a valid GitHub repository name"

          # base_branch: optional, a conservative character set, then git's own ref-format rules.
          if [ -n "$INPUT_BASE_BRANCH" ]; then
            [[ "$INPUT_BASE_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] \
              || fail base_branch "contains characters outside [A-Za-z0-9._/-] or is too long"
            git check-ref-format "refs/heads/$INPUT_BASE_BRANCH" \
              || fail base_branch "is not a valid git branch name"
          fi

          # do_propose: a boolean input arrives as 'true' or 'false'; anything else is a defect.
          case "$INPUT_DO_PROPOSE" in
            true | false) ;;
            *) fail do_propose "must be true or false" ;;
          esac

          # authorization_record: one JSON file directly under ops/proposal-authorizations/ (no
          # subdirectory, no '..'), required for a real write.
          record_re='^ops/proposal-authorizations/[A-Za-z0-9][A-Za-z0-9._-]*[.]json$'
          if [ -n "$INPUT_AUTHORIZATION_RECORD" ]; then
            [[ "$INPUT_AUTHORIZATION_RECORD" =~ $record_re ]] \
              || fail authorization_record "must be ops/proposal-authorizations/<name>.json"
            [ "${#INPUT_AUTHORIZATION_RECORD}" -le 200 ] \
              || fail authorization_record "is too long"
          elif [ "$INPUT_DO_PROPOSE" = "true" ]; then
            fail authorization_record "is required when do_propose is checked"
          fi

          {
            echo "owner=$owner"
            echo "name=$name"
            echo "repo=$INPUT_REPO"
            echo "base_branch=$INPUT_BASE_BRANCH"
            echo "authorization_record=$INPUT_AUTHORIZATION_RECORD"
          } >> "$GITHUB_OUTPUT"

      # Full depth: the command reads the authorization record's merge provenance from git history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the authorization record is a regular file in this checkout
        env:
          AUTHORIZATION_RECORD: ${{ steps.validate.outputs.authorization_record }}
        run: |
          set -euo pipefail
          if [ -n "$AUTHORIZATION_RECORD" ] && { [ ! -f "$AUTHORIZATION_RECORD" ] || [ -L "$AUTHORIZATION_RECORD" ]; }; then
            echo "::error::the authorization record is missing or is not a regular file in this checkout"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # Read-only, by explicit permission-* inputs: the dry run reads the target's current revision
      # and writes nothing. Scoped to exactly the one target repository.
      - name: Mint a read-only installation token, scoped to this target repository alone
        id: read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.validate.outputs.owner }}
          repositories: ${{ steps.validate.outputs.name }}
          permission-contents: read
          permission-metadata: read

      - name: Dry run - report the plan and the authorization decision, no write
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ steps.validate.outputs.repo }}
          BASE_BRANCH: ${{ steps.validate.outputs.base_branch }}
          AUTHORIZATION_RECORD: ${{ steps.validate.outputs.authorization_record }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --trigger-sha "$TRIGGER_SHA")
          if [ -n "$BASE_BRANCH" ]; then
            args+=(--base-branch "$BASE_BRANCH")
          fi
          if [ -n "$AUTHORIZATION_RECORD" ]; then
            args+=(--authorization-record "$AUTHORIZATION_RECORD")
          fi
          if repository-presenter propose "${args[@]}"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -eq 3 ]; then
            echo "::error::proposal refused (exit 3): the dry run was refused for a typed reason, printed above; nothing was written"
          fi
          exit "$status"

  write:
    name: Propose README to ${{ inputs.repo }}
    needs: dry-run
    if: ${{ inputs.do_propose && needs.dry-run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The checkout's own grant only; the write capability is the App installation token below.
    permissions:
      contents: read
    steps:
      # Full depth: the command reads the authorization record's merge provenance from git history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      # Installed before the write token exists, so no dependency code ever runs with it.
      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # Scoped to exactly the one target repository; never the whole App installation. The
      # permission-* inputs are the minimum the effect uses: contents write (branch refs and the
      # README PUT) and pull-requests write (open or refresh the presenter PR). No issues, no
      # administration, and no other write scope. The target coordinates are the validated outputs
      # of `dry-run`, consumed here as action inputs, never as shell text.
      - name: Mint a fresh installation token, scoped to this target repository alone
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ needs.dry-run.outputs.owner }}
          repositories: ${{ needs.dry-run.outputs.name }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: "Propose for real (gated: REPOSITORY_PRESENTER_PROPOSAL_WRITE_AUTHORIZED set only here)"
        env:
          REPOSITORY_PRESENTER_PROPOSAL_WRITE_AUTHORIZED: "1"
          GH_PROPOSAL_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ needs.dry-run.outputs.repo }}
          BASE_BRANCH: ${{ needs.dry-run.outputs.base_branch }}
          AUTHORIZATION_RECORD: ${{ needs.dry-run.outputs.authorization_record }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --trigger-sha "$TRIGGER_SHA")
          if [ -n "$BASE_BRANCH" ]; then
            args+=(--base-branch "$BASE_BRANCH")
          fi
          args+=(--authorization-record "$AUTHORIZATION_RECORD")
          if repository-presenter propose "${args[@]}" --propose; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -eq 3 ]; then
            echo "::error::proposal refused (exit 3): the command refused the write for a typed reason, printed above; nothing was written"
          fi
          exit "$status"
