# The real, durable-state-backed hosted README transaction (G5-W05; docs/EXECUTION_STATE_MACHINE.md
# G5 Work item 3) - distinct from monitor.yml's own deliberately-minimal read-only reachability stub
# (that file's own header names present.yml as the thing it is explicitly NOT). This is one
# isolated job per repository: it clones and analyzes exactly one target repository, named by the
# trigger, never a portfolio sweep.
#
# Fail-closed GitHub App authentication (plans/idea.md's own binding principle: "Production must
# fail closed if GitHub App authentication is unavailable; it must not silently fall back to a
# personal access token"): the one and only way this job can read the target repository is a fresh
# installation token minted here, scoped to that repository alone, via actions/create-github-app-
# token - the same official action verify-app-installation.yml and audit-app-installations.yml
# already use (AGENTS.md's battle-tested-solutions rule). That mint step carries no
# `continue-on-error`, unlike audit-app-installations.yml's own per-org leg: here a failed mint must
# fail the whole job, never fall through to some other credential. No step anywhere in this workflow
# reads `secrets.GITHUB_TOKEN` (or `github.token`) as `GH_TOKEN`/`GITHUB_TOKEN` for the analysis
# clone - the only place the default job token is used at all is `REPOSITORY_PRESENTER_STATE_TOKEN`
# below, a distinctly-named credential for a distinctly-scoped purpose (see that step's own comment).
#
# Durable state (G5-W04: src/repository_presenter/core/state/): `present --durable-state` wires
# recovery_sweep, trigger admission/deduplication, and a committed transition receipt around the
# existing, unmodified local pipeline (core/state/present_transaction.py has the full design and
# why a killed/retried run recovers cleanly via recovery_sweep on its own next invocation, even
# though this workflow cannot itself exercise a mid-run kill - that failure-mode exercise is
# G7-W05's own explicit scope).
#
# workflow_dispatch, repository_dispatch and workflow_call (docs/STATE_MACHINE.md section 3.2's own
# trigger vocabulary). No `schedule:` trigger here: unattended scheduling is sealing-scheduled.yml's
# own job, which calls this workflow once per drifted repository via workflow_call (G7-W06 work item
# 3). That call is the only reuse - this file's pipeline is never copied.
#
# A successful run whose bundle is READY_FOR_PROPOSAL exports that bundle as a workflow artifact
# (`sealed-<owner>__<name>`) for the gated propose job; a runner's candidates/ never outlives the job.
#
# Where this runs (owner decision D5, 2026-10-11; docs/SELF_HOSTED_RUNNER.md): the repository
# variable REPOSITORY_PRESENTER_SEAL_RUNNER selects the runner for this one pipeline and nothing
# else. Unset, empty or `ubuntu-latest` is the hosted behaviour described above, byte for byte: the
# default, and what runs until the owner sets the variable. `self-hosted-windows` runs the same
# steps on the owner's registered machine (labels below), where the toolchains, Python 3.13.2 and
# the machine's toolchain registry are the environment the sealed bundles were produced in. Any
# other value fails the run closed. Only this workflow ever targets the self-hosted labels; the
# monitor, the candidates publication, the proposals and the issues stay hosted.
#
# The decision is made once, by the `select-runner` job, on a GitHub-hosted runner, before the
# self-hosted machine is asked for anything. Selecting the self-hosted runner is refused unless the
# trigger is trusted: a schedule, a dispatch or a repository dispatch on the default branch (a
# workflow_call carries its caller's event, so a pull_request caller is refused too). The gateway
# key and the App secrets reach the self-hosted machine only inside this job, in the steps that
# name them, never at job level and never on disk. This guard cannot stop a pull request from a
# fork that rewrites a workflow to ask for the labels itself; that is closed by the repository
# setting the preflight checks (docs/SELF_HOSTED_RUNNER.md section 2), not by YAML.
#
# On the self-hosted machine the job starts from an empty workspace, builds its own virtual
# environment from the lock with the pinned interpreter, provisions no toolchain (the machine has
# them; the first step after the install verifies them, read-only, with tools/runner/check_runner.py),
# and ends by emptying the workspace and the folders it made, whatever the outcome.
name: Present

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/name, exactly as listed in the registry (e.g. aspose-3d-foss/Aspose.3D-FOSS-for-Python)"
        required: true
        type: string
  repository_dispatch:
    types: [present]
  workflow_call:
    inputs:
      repository:
        description: "owner/name, exactly as listed in the registry; the scheduled sealing run's per-repository target"
        required: true
        type: string

permissions:
  # contents: write is for this control repository's own internal state-ref namespace only
  # (refs/repository-presenter-state/records/...) - a GitHub Actions job token can only ever act on
  # the repository the workflow runs in, never any other, so this grant cannot reach the target
  # repository named by the trigger; that repository is read with the separately-minted, read-only
  # App installation token below.
  contents: write

# Concurrency: one group per target repository, cancel-in-progress false because a cancelled run can
# stop between durable-state transitions; a second run for the same target queues behind the first.
# Group names differ from sealing-scheduled.yml's own (seal-*), so the reusable call cannot deadlock.
concurrency:
  group: present-${{ inputs.repository || github.event.client_payload.repository || 'unknown' }}
  cancel-in-progress: false

jobs:
  select-runner:
    name: Select the seal runner
    # Always hosted: this job decides, and an untrusted trigger must never reach the self-hosted
    # machine to be refused there. It holds no secret and no token (permissions: {}); the
    # variable is a name, not a credential.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      shell: ${{ steps.select.outputs.shell }}
      timeout_minutes: ${{ steps.select.outputs.timeout_minutes }}
    steps:
      - name: Select the runner; refuse an untrusted trigger for the self-hosted one
        id: select
        env:
          # Reach the script as quoted shell variables only, never as interpolated script text.
          SELECTED: ${{ vars.REPOSITORY_PRESENTER_SEAL_RUNNER }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          case "$SELECTED" in
            "" | ubuntu-latest)
              # The hosted behaviour, unchanged: ubuntu-latest, the shell GitHub picks by default
              # on Linux (`bash -e {0}`), and GitHub's own default job timeout (360 minutes).
              runs_on='"ubuntu-latest"'
              shell='bash -e {0}'
              timeout_minutes=360
              echo "seal runner: ubuntu-latest (hosted)"
              ;;
            self-hosted-windows)
              # Trusted triggers only: a schedule, a dispatch or a repository dispatch, on the
              # default branch. A workflow_call reports its caller's event and ref, so a caller
              # triggered by a pull request, a push or a comment is refused here too.
              case "$EVENT_NAME" in
                schedule | workflow_dispatch | repository_dispatch) ;;
                *)
                  echo "::error::the self-hosted seal runner is for schedule, dispatch and repository_dispatch triggers only"
                  exit 1
                  ;;
              esac
              if [ "$REF" != "refs/heads/${DEFAULT_BRANCH:-main}" ]; then
                echo "::error::the self-hosted seal runner runs the default branch only; dispatch this workflow from the default branch"
                exit 1
              fi
              runs_on='["self-hosted","windows","x64","repository-presenter-seal"]'
              shell='bash'
              timeout_minutes=120
              echo "seal runner: self-hosted-windows (trusted trigger: $EVENT_NAME)"
              ;;
            *)
              echo "::error::REPOSITORY_PRESENTER_SEAL_RUNNER must be unset, ubuntu-latest or self-hosted-windows"
              exit 1
              ;;
          esac
          {
            echo "runs_on=$runs_on"
            echo "shell=$shell"
            echo "timeout_minutes=$timeout_minutes"
          } >> "$GITHUB_OUTPUT"

  present:
    name: Present one repository (durable-state-backed)
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    # Hosted: GitHub's default (360). Self-hosted: a seal stuck on a dead toolchain must not hold
    # the machine; the health check's own wall-clock budget is one hour.
    timeout-minutes: ${{ fromJSON(needs.select-runner.outputs.timeout_minutes) }}
    defaults:
      run:
        # Hosted: `bash -e {0}`, exactly the shell an unset `shell:` gives on Linux. Self-hosted
        # Windows: Git for Windows' bash (the runner's PATH puts it ahead of WSL's launcher;
        # tools/runner/check_runner.py checks that), because every script below is bash.
        shell: ${{ needs.select-runner.outputs.shell }}
    steps:
      # Self-hosted only: nothing from an earlier job is in the workspace. A hosted runner is a
      # fresh machine, so this step does not exist there. The folders it empties are the job's
      # own workspace and, below, named subfolders of its temp folder (never the temp folder
      # itself: the runner keeps this very step's script and its output files there).
      - name: Start from an empty workspace (self-hosted)
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -eu
          work="$(dirname "$(cygpath -u "$RUNNER_TEMP")")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          case "$work" in /?*/?*) ;; *) echo "::error::refusing to empty a workspace: the runner work folder is not recognisable"; exit 1 ;; esac
          case "$workspace" in "$work"/?*/?*) ;; *) echo "::error::refusing to empty a workspace that is not inside the runner work folder"; exit 1 ;; esac
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          for leftover in rp-venv noop-proof sealed-export transaction-artifact; do
            rm -rf "$RUNNER_TEMP/$leftover"
          done

      # persist-credentials: false - actions/checkout's own default persists a
      # github.com-scoped `http.https://github.com/.extraheader` credential in .git/config for
      # every later step to inherit. This job never needs that credential (its own git operations
      # against both the target repository and this control repository's own state ref carry their
      # own explicit, distinctly-scoped tokens via GitStateBackend/pinned_read_only_clone's
      # github_https_auth_env, never the checkout's ambient one) - and a hosted run, not locally
      # reproducible under act's own checkout mechanism, proved live why leaving it on is actively
      # harmful: git's own http.extraheader config is a per-host, not per-repository, setting, so
      # the checkout's own persisted header for https://github.com/ and this job's own explicit
      # header for the *target* repository's clone (a different repository, same host) both apply
      # to the same request - GitHub's own server then rejects it outright ("remote: Duplicate
      # header: \"Authorization\"", HTTP 400), the real cause behind present.yml's first two hosted
      # runs' own opaque "cannot resolve the default-branch revision" failures (36846316608,
      # 36846738278; core/git_safety/clone.py's own failure_detail fix is what made this visible at
      # all - see docs/DECISION_LOG.md, this date).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the target repository from this trigger
        id: target
        env:
          # Untrusted trigger input: reaches the script only as a quoted shell variable, never as
          # interpolated script text.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPOSITORY: ${{ inputs.repository }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            repository="$PAYLOAD_REPOSITORY"
          else
            repository="$DISPATCH_REPOSITORY"
          fi
          if [ -z "$repository" ]; then
            echo "::error::no target repository named by this trigger"
            exit 1
          fi
          # Validate before anything is written to $GITHUB_OUTPUT: a value with a newline, a CR,
          # '=' or '::' must never become an extra output or a workflow command. The error names
          # the rule, never the raw value. Same patterns as propose.yml's validation step.
          owner_re='^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$'
          name_re='^[A-Za-z0-9._][A-Za-z0-9._-]{0,99}$'
          if [[ "$repository" != */* ]]; then
            echo "::error::the target repository is not an owner/name repository coordinate"
            exit 1
          fi
          owner="${repository%%/*}"
          name="${repository#*/}"
          if ! [[ "$owner" =~ $owner_re ]] || ! [[ "$name" =~ $name_re ]] ||
             [ "$name" = "." ] || [ "$name" = ".." ]; then
            echo "::error::the target repository is not a valid GitHub owner/name coordinate"
            exit 1
          fi
          # Outputs are written from the validated variables only.
          echo "repository: $owner/$name"
          {
            echo "repository=$owner/$name"
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      # Read-only, by explicit permission-* inputs: without them this token would inherit every
      # permission the App holds, including contents and pull_requests write. This job's steps only
      # clone the target and read its metadata, contents, trees and commits.
      - name: Mint a read-only installation token, scoped to the target repository alone
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-metadata: read

      - name: Python 3.11 for the presenter (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      # Self-hosted only: the presenter runs on the interpreter the sealed bundles record
      # (environment.python_version 3.13.2, os Windows), in a virtual environment of its own under
      # the job's temp folder, so no package from an earlier job can be present and the installed
      # set is exactly the lock's (the site manifest in a bundle's environment fingerprint hashes
      # that set). The interpreter's path comes from the runner's own .env (RP_SEAL_PYTHON), never
      # from this repository; a different patch version fails here, before any provider call,
      # because it would reopen EXTRACTING for every candidate.
      - name: Pinned interpreter and virtual environment (self-hosted)
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          EXPECTED_PYTHON: "3.13.2"
        run: |
          set -eu
          if [ -z "${RP_SEAL_PYTHON:-}" ]; then
            echo "::error::RP_SEAL_PYTHON is not set in the runner's .env file (docs/SELF_HOSTED_RUNNER.md section 3)"
            exit 1
          fi
          actual="$("$RP_SEAL_PYTHON" -c 'import platform; print(platform.python_version())')"
          if [ "$actual" != "$EXPECTED_PYTHON" ]; then
            echo "::error::the pinned interpreter is Python $actual; the sealed bundles record $EXPECTED_PYTHON"
            exit 1
          fi
          "$RP_SEAL_PYTHON" -m venv "$RUNNER_TEMP/rp-venv"
          cygpath -w "$RUNNER_TEMP/rp-venv/Scripts" >> "$GITHUB_PATH"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"

      - name: Install from the lock
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      # Toolchains for the example verifiers (src/repository_presenter/components/readme/extractors/
      # platforms/*_examples.py). Each verifier resolves its executable from this job's PATH alone on
      # a hosted runner - the machine-local registry (C:/tools/rp-toolchains) does not exist here - so
      # every executable a verifier invokes is provisioned by a step below. Java runs javac only; no
      # verifier invokes Maven, so none is installed. Python 3.11 is the presenter's own interpreter
      # (set up above); 3.12 and 3.13 are pinned uv venvs for requires-python declarations it does not admit.
      # Every provisioning step below is hosted-only (`runner.environment`): the self-hosted machine
      # has its toolchains already and provisions nothing, so a self-hosted seal cannot install or
      # download a compiler; it verifies the ones it has in the step after them.
      - name: Install uv (provisions the pinned Python venvs for the Python verifier)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"

      - name: Provision the 3.12 and 3.13 venvs under RUNNER_TEMP
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -eu
          for minor in 12 13; do
            uv python install "3.$minor"
            uv venv --python "3.$minor" "$RUNNER_TEMP/rp-python/py3$minor"
          done

      - name: .NET SDKs for the .NET verifier (dotnet)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: JDK 21 for the Java verifier (javac)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Node 24 for the TypeScript verifier (node, npm)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # tsc 5.9.3 is the version typescript_examples.py's own registry records as probe-compatible;
      # the newest tsc on a hosted image can refuse a repository's declared moduleResolution.
      - name: tsc 5.9.3 for the TypeScript verifier, on PATH
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -eu
          prefix="$RUNNER_TEMP/tsc"
          npm install --prefix "$prefix" typescript@5.9.3
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Go for the Go verifier (go)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Rust toolchain for the Rust verifier (cargo)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # branch: stable
        with:
          toolchain: stable

      - name: GCC, CMake and Ninja for the C++ verifier (g++, cmake, ninja)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build

      # Self-hosted only, read-only, no network and no secret: the machine is the environment of
      # record, so the things that make it one are checked before a provider call is made - the
      # pinned interpreter, Git for Windows' bash ahead of WSL's, the toolchain registry and every
      # tool a verifier invokes, free disk space, and no credential-shaped name in the runner's
      # .env. A failure names the check; the fix is on the machine (docs/SELF_HOSTED_RUNNER.md).
      - name: Verify the machine environment (self-hosted, read-only)
        if: ${{ runner.environment == 'self-hosted' }}
        run: python tools/runner/check_runner.py --job

      - name: LLM gateway reachable; record the model catalog present needs
        env:
          GPT_OSS_ENDPOINT: ${{ secrets.GPT_OSS_ENDPOINT }}
          GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}
        run: repository-presenter preflight

      - name: Start the wall-clock timer (G7-W03's own budget input)
        id: timer
        run: echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Present the target repository, durable-state-backed
        env:
          # The target repository's own read-only analysis credential - the installation token
          # minted above, scoped to that repository alone. Ambient GH_TOKEN/GITHUB_TOKEN in this
          # runner's environment is never read for this: this explicit assignment is the only value
          # core/git_safety's clone path or this job ever supplies for it.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # This control repository's own write token for its internal state-ref namespace only
          # (core/state/present_transaction.py::STATE_TOKEN_VARIABLE) - the job's own default token,
          # which GitHub Actions scopes to this repository alone and nothing else. Distinct in name
          # and purpose from GH_TOKEN above; never used for the target repository.
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Where the Python verifier finds the pinned py3NN venvs provisioned above
          # (python_examples.py's RP_PYTHON_TOOLCHAINS; without it a requires-python >=3.12 target is NOT_VERIFIED).
          # Hosted only: the self-hosted machine finds its interpreters itself (core/toolchains.py),
          # and an empty value is read as unset.
          RP_PYTHON_TOOLCHAINS: ${{ runner.environment == 'github-hosted' && format('{0}/rp-python', runner.temp) || '' }}
          GPT_OSS_ENDPOINT: ${{ secrets.GPT_OSS_ENDPOINT }}
          GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}
          # The target repository and trigger type reach the script as quoted shell variables, never
          # as interpolated script text.
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TRIGGER_EVENT_TYPE: ${{ github.event_name == 'repository_dispatch' && 'repository_dispatch' || 'workflow_dispatch' }}
        run: |
          # Two invocations, deliberately, in this one job: a fresh GitHub Actions runner always
          # starts with empty runs/ (gitignored, never committed), so the *first* invocation alone
          # can never be the no-op proof - this is not special to a hosted runner, it is this
          # project's own existing, required design for any candidate to ever reach
          # READY_FOR_PROPOSAL at all (bundle/seal.py's own seal_candidate: a first seal always
          # records state ACCEPTED with "the no-op proof needs a rerun in a fresh process" - no
          # single invocation can ever prove itself byte-identical to itself). The second
          # invocation, sharing this same job's own now-warm runs/ call-store cache, is that fresh-
          # process rerun: zero new provider calls, the literal acceptance-bar proof. A distinct
          # --workflow-run-id for each keeps trigger.py's own dedup (section 3.2) from folding the
          # second call into the first's already-completed transaction and skipping it outright.
          # Each invocation writes a record (--invocation-record) of its process and the call
          # ledger it used; after the rerun, `verify-noop-proof` is what gates this step: it
          # counts the rerun's provider calls from that ledger and requires the two runs to have
          # been different processes. An exit code of 0 alone proves neither.
          noop_dir="$RUNNER_TEMP/noop-proof"
          mkdir -p "$noop_dir"
          if repository-presenter present \
            --repo "$TARGET_REPOSITORY" \
            --durable-state \
            --invocation-record "$noop_dir/first.json" \
            --trigger-event-type "$TRIGGER_EVENT_TYPE" \
            --workflow-run-id "${{ github.run_id }}"; then
            first_exit=0
          else
            first_exit=$?
          fi
          if [ "$first_exit" -ne 0 ]; then
            echo "::error::first present invocation failed (exit $first_exit); skipping the no-op-proof rerun"
            exit "$first_exit"
          fi
          echo "::group::No-op proof: a second, fresh-process rerun against the same revision"
          repository-presenter present \
            --repo "$TARGET_REPOSITORY" \
            --durable-state \
            --trigger-event-type "$TRIGGER_EVENT_TYPE" \
            --workflow-run-id "${{ github.run_id }}-noop-proof" \
            --invocation-record "$noop_dir/second.json"
          if ! repository-presenter verify-noop-proof \
            --first "$noop_dir/first.json" \
            --second "$noop_dir/second.json"; then
            echo "::error::no-op proof failed: the rerun is not proven a different process making zero provider calls (typed reason on the line above)"
            exit 1
          fi
          echo "::endgroup::"

      # Hands the bundle this run just sealed to the gated propose job, and only when it is
      # READY_FOR_PROPOSAL (`sealed-ready` names the CURRENT revision and verifies its manifest). A
      # bundle left in any other state is never exported, so it can never be proposed.
      - name: Export a READY_FOR_PROPOSAL bundle for the propose job
        id: export
        env:
          REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -eu
          slug="${REPOSITORY%%/*}__${REPOSITORY#*/}"
          if repository-presenter sealed-ready --repo "$REPOSITORY"; then
            dest="$RUNNER_TEMP/sealed-export"
            rm -rf "$dest"
            mkdir -p "$dest"
            revision=$(cat "candidates/$slug/CURRENT")
            cp "candidates/$slug/CURRENT" "$dest/CURRENT"
            cp -r "candidates/$slug/$revision" "$dest/$revision"
            echo "exported=true" >> "$GITHUB_OUTPUT"
          else
            echo "exported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the sealed bundle
        if: ${{ steps.export.outputs.exported == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sealed-${{ steps.target.outputs.owner }}__${{ steps.target.outputs.name }}
          path: ${{ runner.temp }}/sealed-export
          if-no-files-found: error
          retention-days: 7

      # G7-W03 (EXECUTION_STATE_MACHINE.md G7 Work item 1/4) - dead-man monitoring, the
      # product-portfolio equivalent of liveness.yml's own control-repository supervision.
      # `if: always()` so a failed present step above is itself observed and alerted on, never
      # silently skipped - core/state/health.py's own rules read the durable record the present
      # step just committed (success or failure alike) and name a specific repository/stage/kind
      # rather than leaving "the job went red" to be the only signal. Read-only: no write
      # credential beyond the same state-ref read already used above.
      - name: "Health: alert on this transaction's own outcome"
        # always() except when the trigger itself never resolved a repository at all (the
        # "Resolve the target repository" step above failed) - there is then no coordinate to
        # check and that step's own ::error:: already names the problem; avoids a second, empty
        # --repo invocation adding a confusing, redundant failure.
        if: always() && steps.target.outcome == 'success'
        env:
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Step outputs reach the script only as quoted shell variables, never as interpolated text.
          STARTED: ${{ steps.timer.outputs.started }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          started="$STARTED"
          if [ -n "$started" ]; then
            elapsed=$(( $(date -u +%s) - started ))
            echo "wall-clock: ${elapsed}s"
            repository-presenter health-check \
              --repo "$TARGET_REPOSITORY" \
              --wall-clock-seconds "$elapsed"
          else
            # The timer step itself never ran (a step between it and target resolution failed,
            # e.g. the App-token mint or the lock install) - that step's own ::error:: already
            # names the problem; still check the durable record without a wall-clock reading
            # rather than skip health entirely.
            repository-presenter health-check --repo "$TARGET_REPOSITORY"
          fi

      # Diagnosis for a red seal. A failed seal used to upload no artifacts at all, so its reason
      # (its transaction's own output under runs/transactions/) was unreadable from GitHub. Runs
      # only on a red run. The staging step copies the transaction output and EXCLUDES the call
      # store (calls/: full request bodies and raw responses) and every file holding a configured
      # secret's value or a secret-shaped value (core/secrets.py::stage_transaction_for_upload);
      # exclusions are printed by path and reason, never by value. Only the staged copy is uploaded,
      # never the raw directory, and a failed staging step leaves nothing to upload.
      - name: Stage this seal's transaction output for diagnosis (redacted)
        if: ${{ failure() }}
        env:
          TRANSACTION: runs/transactions/${{ steps.target.outputs.owner }}__${{ steps.target.outputs.name }}
          STAGING: ${{ runner.temp }}/transaction-artifact
          # The same credentials this job's own steps hold, so the redaction scan sees every value
          # this runner could have written to a file. Read only by the staging command; never printed.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: repository-presenter stage-transaction-artifact --transaction "$TRANSACTION" --staging "$STAGING"

      - name: Upload this seal's redacted transaction output (failed runs only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: seal-transaction-${{ steps.target.outputs.owner }}__${{ steps.target.outputs.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transaction-artifact
          if-no-files-found: ignore
          retention-days: 14

      # Self-hosted only, last, whatever happened: nothing of this seal stays on the machine. The
      # uploads above have run; the workspace (the clone of this repository, runs/ with its call
      # store, candidates/) and the folders this job made in its temp folder are emptied. A file
      # Windows still holds open is a warning, not a failure: the next job's first step empties
      # the workspace again and the runner clears its temp folder at the start of every job.
      - name: Leave nothing behind (self-hosted)
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          set -u
          work="$(dirname "$(cygpath -u "$RUNNER_TEMP")")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          case "$work" in /?*/?*) ;; *) echo "::warning::not emptying the workspace: the runner work folder is not recognisable"; exit 0 ;; esac
          case "$workspace" in "$work"/?*/?*) ;; *) echo "::warning::not emptying a workspace outside the runner work folder"; exit 0 ;; esac
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || echo "::warning::part of the workspace could not be removed"
          for leftover in rp-venv noop-proof sealed-export transaction-artifact; do
            rm -rf "$RUNNER_TEMP/$leftover" || echo "::warning::$leftover could not be removed"
          done
