active_work_item:
  id: G4-W17
  status: IN_PROGRESS
  purpose: 'Shared-code fixes the lanes propose (owner, 2026-09-06 08:00; section 28.12 Lanes). While lanes B, C and D compose their cohorts they may not edit composition/, review/, repair/, the renderer, prompts/, core/ or the facades; each shared-code defect they meet is a PROPOSAL entry in their lane log (docs/RESEARCH_LANE_B.md, _C, _D) with the exact file, defect, repository and finding, and the repository gets a disposition naming that proposal. This item lands those fixes in arrival order, each with a mutation test, every class a round exposes in the same iteration, and after each landing notifies nothing - the reviewer re-spawns the lane, whose re-run converts the dispositions. Time box 90 minutes per landing pass (owner, 2026-09-06 10:45, after the arrival list grew to 22 items across three lane cycles with nothing yet landed and G4-W11 ran 67 minutes past its own unrelated box with no mechanical check noticing - the shape of unbounded machinery growth this project exists to avoid, RESEARCH section 30.8): land item (0) always first (the single highest-leverage fix, corroborated by three lanes independently); at each 90-minute box, stop, run `repository-presenter status`, and report the actual sealed-candidate delta since the box opened - zero landed items in a box is not itself a failure (arrival-list triage and a hard multi-facade fix can each cost a full box) but two consecutive zero-delta boxes is a stop-and-escalate signal: freeze new PROPOSAL intake, land only items with two or more corroborating lanes, and record a section 31 entry naming which items are cut for now. Runs BEFORE G3-W04 (reordered 2026-09-06 09:00: lane B''s first cohort sealed nothing for want of shared fixes, and the Python dispositions need the same prompts) and stays active while any lane has an open item; it never composes a lane repository itself and never edits a lane path. Acceptance: every PROPOSAL recorded before the item''s last iteration is either landed with its test or declined with a reason in section 31; hosted CI green. Arrival list (reviewer-maintained; land in this order except (0), which precedes everything - it is the single highest-leverage fix found so far): (0) validation/registry.py _check_install (BC-02) marks an install command SUPPORTED only when a registry confirms the package published, so no unpublished repository in the whole portfolio - BarCode, Email, Note in the sealed Python cohort report, four of four C++ repositories here, two of two remaining TypeScript repositories - can ever pass it; admit a verified source build (clone, configure, build or compile succeeding) as an alternate SUPPORTED path when the registry says not-yet-published, recorded as which path supported the fact - refinement confirmed independently by lane D''s Rust reading (crates.io answers 404 to a conclusive check, not just "not yet"): the admitted fact is a **source** install kind, never a registry command, so renderer.py''s published-package branch must not render "install the published package from crates.io" / `cargo add` / `pip install <name>` for a package no registry lists - it renders the source-build fallback instead [lane B, Cells/Email/PDF/Slides C++; lane D, Cells Rust; the Python and TypeScript unpublished repositories]. (1) prompts/source_reconciliation - the packet names the sections that render nothing for this repository (no registry package, no licence file) so a unit is never placed into an empty section [lane B, 3D TypeScript, BLOCKED_RECONCILIATION at S4]; (2) core/llm CallStore.reject - the rejected-reply filename is the longest path any transaction writes; shorten it (hash prefix) so a 260-character Windows limit is not hit from a long checkout root [lane B, Cells TypeScript, BLOCKED_ENVIRONMENT]; (3) core/ecosystems.spec_for discovers SPEC by module name as registry.py discovers PLUGIN, so a lane never edits a shared table [lane B]; (4) the surface facade''s _KINDS lacks abstract_class_declaration [lane B]; (5) the renderer''s _IMPORT verify line is Python-shaped; read it from the spec [lane B]; (6) tests/.../test_registry.py asserts known_ecosystems() literally - make it discovery-based so registering an ecosystem needs no shared test edit [lane B]; (7) the prompt changes the Python dispositions name for BarCode, Email and Note (G3-W01 cohort report) - authoring and planning; (8) extractors/surface/registry.py maps go to "goproxy" while the vendored adapter table is keyed "go_modules", and observe() passes no module_path (the Go adapter reads candidate["module_path"], so fixing only the key raises KeyError) - the proxy is never probed, install_command:go stays UNRESOLVED, and BC-02 fails closed on it [lane D, both Go repositories, BLOCKED_SHARED_CODE]; (9) extractors/surface/extractor.py _KINDS has no entry for the vendored engine''s Go kinds (type_spec, the literal function), so every Go type renders unknown and the Core API table is empty [lane D]; items (8) and (9) land together - (9) alone leaves BC-02 failing, (8) alone leaves an empty API table - and unblock both Go dispositions on re-run; (10) renderer.py _installation appends a hard-coded pip install . block for any ecosystem with an executed example, and EcosystemSpec''s docstring names a source_install field the dataclass lacks [lane D, confirmed independently by lane B - the same hard-coded block, every non-Python ecosystem]; (11) renderer.py _IMPORT matches only Python-shaped imports, so a Go, Rust or C# import path never matches an executed example and spec.verify_command never renders [lane D, confirmed for Rust''s `use` syntax too]; when it lands, also skip the Verify-the-install block entirely for a spec that declares no verify_command, rather than rendering an empty bash fence [lane D]; (12) extractors/surface/registry.py::observe() passes candidate={"name": ...} with no group or artifact coordinate, so the vendored _maven_check''s own group-and-artifact address to maven-metadata.xml can never be built and no Java install fact reaches SUPPORTED - blocks all four Java repositories at S4 (3D, Cells) or BC-02 (Slides, PDF); a three-line patch is in docs/RESEARCH_LANE_C.md [lane C, all four Java repositories, BLOCKED_RECONCILIATION or BLOCKED_VALIDATION]; item (12) lands with (8)-(9) as the next batch - all three are "no install fact reaches SUPPORTED for an entire ecosystem", the same shape once per registry; (13) EcosystemSpec.badge() formats one {package} token, so no Maven Central badge URL fits and Java renders no package badge [lane C]; (14) floor_declaration reads one manifest field per ecosystem, but a POM states the Java floor as maven.compiler.release, .target, or .source - all three appear across this cohort [lane C]; (15) reconciliation/dispositions.py::normalize raises instead of folding a placement into a section that renders nothing, the same shape as (1) but at the code layer - (1) stops the packet from choosing an impossible placement, (15) is the fallback so the same recurring defect (net.py, lane B''s 3D TypeScript, all four Java repositories) does not crash a composition it could not have prevented [lane B, lane C]; (16) composition/planning.py rejects a whole candidate for a trimmable ceiling breach (duplicate api_hubs, Aspose links over the limit) that a targeted re-ask could close instead [lane C]; (17) source_reconciliation rejects a candidate whole for a coverage count error (missing or duplicated units) a targeted re-ask would close [lane C]; (18) authored prose leaking the literal phrase "fact id" is caught by BC-07 at S9 but recorded unrepairable rather than routed to a re-ask [lane C]; (19) extractors/surface/extractor.py''s surface_symbols discards the vendored engine''s own visibility field, so an ecosystem publishes symbols the engine already marked internal [lane B, C++ internal headers]; (20) composition/authoring.py _FORBIDDEN matches "- " or "* " anywhere in a unit rather than only at line start, rejecting authored prose that legitimately contains that substring ("workbook- or sheet-scoped") - anchor both to ^ [lane B, Cells C++, BLOCKED_AUTHORING]; (21) a planned limitation whose only supporting vocabulary is a non-public identifier is unauthorable by construction, and the current retry re-asks authoring instead of the planning stage that chose it [lane B, Slides C++, prompts/repository_investigation.yaml and planning]. Checked and ruled out for Rust, so not re-proposed: the registry-key mismatch of (8) (REGISTRY_TYPES["rust"] and the vendored adapter both read "cargo", observe passes candidate["name"] correctly) and the missing-surface-kind gap of (9) (_KINDS already carries struct_item, enum_item, trait_item, impl_item; only the literal "function" kind is missing, the same one item (9) already fixes for Go). After (0) lands, every BLOCKED_VALIDATION(BC-02) disposition on an unpublished repository across every lane and the Python cohort is a candidate for re-run - the reviewer re-spawns every lane with such a disposition. After (1)-(2) land, the reviewer re-spawns lane B on TypeScript; after (8)-(9) and (12) land, the reviewer re-spawns lane D on the two Go dispositions before G4-W16 and lane C on its four Java dispositions; after (0), (1) and (15) land, lane B on its four C++ dispositions; after (0) lands, lane D on its one Rust disposition. Lane D''s re-run of that one disposition (2026-09-06 14:05, PR #8, 15b958c) proved (0) end to end for the first time - BC-02 passes, measured against a real `cargo build` (38.93s, exit 0), not assumed - and found two new classes, added as (22) and (23) ahead of the rest: (22) validation/registry.py''s _NARRATION guard (BC-07) matches its nine phrases as a bare substring with no word boundary and no exemption for a value that is itself a SUPPORTED public_symbol fact - the bare word "validator" reads a repository''s own public type (`WorkbookValidator`) as internal narration, and no composition can pass without lying about the surface; the fix is word-boundary matching plus a public_symbol-fact and code-span exemption, needed on every repository whose public surface happens to contain a guarded word, not this one alone [lane D, Cells Rust, hard blocker]. (23) a VERIFIED_REWRITE placement''s dropped protected command (BC-08) is recorded unrepairable because the Failure carries no section_id even though the disposition names a destination_section the repair loop may re-author - carry that section id into the failure, and state in the authoring prompt that every command a VERIFIED_REWRITE-placed unit names is kept; this silently strands any repository hitting this shape, not only Rust''s [lane D, Cells Rust; resume predicate: after (22) alone the candidate may already seal - re-run to confirm before assuming (23) also blocks]. Escalation-delta correction (owner, 2026-09-06 14:15, after two checkpoints both read "0 delta" on a count that cannot move without a lane re-run this item never performs itself): the two-consecutive-zero-delta signal is landed G4-W17 items with no lane re-run following within one box, not the bare sealed-candidate count - a checkpoint where an item landed and the reviewer''s mechanized unblock notification (tools/reviewer/unblock_monitor.py) fired is not zero-delta even if no seal resulted yet. (24), ahead of everything - lane B''s C++ re-run (2026-09-06 15:05) proved item (0)''s gate never opens for a registry-less ecosystem: extract.py''s _source_build_fact only admits polarity CONTRADICTED, and cpp has no REGISTRY_TYPES entry so its install fact starts and stays UNRESOLVED. Two parts landed together: _source_build_fact admits UNRESOLVED too, but ONLY when entry.ecosystem not in REGISTRY_TYPES (never for a registry-having ecosystem''s transient UNRESOLVED, which stays failing-closed); platforms/cpp.py''s EcosystemSpec.source_install gets `cmake -S . -B build`, measured working for all four C++ repositories. PDF and Cells C++ have no other blocker - this alone may seal both. Mutation test: a registry-having ecosystem''s UNRESOLVED install fact must not flip to SUPPORTED even with an EXECUTED receipt. (25) composition/planning.py recomputes the additional_examples condition at S5 after quick starts consume examples, so a repository whose plan takes all its examples (Email C++, exactly 2) is rejected twice for a placement it did not make and cannot withdraw [lane B, Email C++, BLOCKED_PLANNING]. (26) validation/registry.py''s _COMMAND/_PLACING reads a hyphenated package name in prose (python-pptx) as a shell command, then requires VERIFIED_REWRITE to preserve it verbatim - the same class awaits python-docx, go-*, git-*, cargo-* [lane B, Slides C++, BC-08]. After (24) lands, the reviewer re-runs lane B''s remaining C++ dispositions; after (25) or (26) land, re-run the specific repository each names.'
