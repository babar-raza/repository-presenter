active_work_item:
  id: G1-W02
  status: IN_PROGRESS
  purpose: "Facts stage for the canary - distribution name, import path, exported symbols, Python range, verified executable examples, formats, license, and the material-unit inventory of the existing README as typed facts.json records with evidence IDs and polarity; the Python consumer and example verifier as the first platform plugin behind a registry; a PSD-style README-only fixture returns insufficient_evidence with a resume predicate and zero LLM calls."
  prerequisites:
    - G1-W01 is accepted and its pushed main has a green hosted CI run, checked at the start of the iteration.
    - Every pull follows migration/reuse-manifest.yaml audit.per_pull_checks; the legacy ecosystems and profile packages enter only through a platform plugin registry keyed by ecosystem, never as a central chain.
    - docs/README_CONTRACT.md section 3 stage S2 defines the fact kinds and the record shape; no gateway credential is needed.
  owned_paths:
    - src/repository_presenter/
    - tests/
    - schemas/
    - migration/reuse-manifest.yaml
    - data/
  acceptance:
    - "repository-presenter present --repo aspose-3d-foss/Aspose.3D-FOSS-for-Python writes facts.json from the source/ snapshot with typed records {id, kind, value, evidence[], polarity, confidence} covering the deterministic fact kinds of docs/README_CONTRACT.md section 3 stage S2 that the canary's tree supports, each record naming its evidence paths."
    - Every example fact carries a verification receipt from an isolated run of the exact example against the canary's own package; an example that does not run is recorded as CONTRADICTED, never explained away.
    - The Python consumer and example verifier are the first platform plugin behind a registry keyed by ecosystem; no if/elif chain selects a platform.
    - A README-only fixture under tests/fixtures/ yields insufficient_evidence with a resume predicate and zero LLM calls.
    - Every pulled legacy file has one manifest file record with its SHA-256 at the frozen revision, a cut import closure, and ported tests; every new module has a production importer exercised by present.
    - An immediate rerun on the same revision produces byte-identical facts.json with zero provider calls.
    - ruff, ruff format, mypy, and pytest pass locally on Python 3.11, 3.12, and 3.13; the commit is pushed and hosted CI is checked at the next iteration.
  evidence_required:
    - facts.json for the canary at its pinned revision.
    - Manifest file records for every pulled legacy file.
  blocker: null

