active_work_item:
  id: G1-W06
  status: READY
  purpose: "Bundle, seal, and no-op - README.md, README.patch, facts.json, investigation.json, dispositions.json, plan.json, content_units.json, validation.json, review.json, repairs.json, calls.jsonl, dependencies.json with exact hashes of every consumed input, and manifest.json with checksums at candidates/<owner>__<name>/<revision>/ with CURRENT naming the revision; a fresh process on the same inputs reproduces the same bytes with zero calls and the ledger records cache reuse per job, which judges check 11; status prints 1/34; consumes OWNER-02 through the G1-W03 jobs."
  prerequisites:
    - G1-W05 is accepted and its pushed main has a green hosted CI run, checked at the start of the iteration.
    - docs/README_CONTRACT.md section 7 and schemas/candidate-bundle.schema.json define the bundle layout, the manifest, and the dependency record; docs/STATE_MACHINE.md section 9 defines which dependency hashes a candidate declares and what each reopens.
    - The transaction under runs/transactions/ holds every artifact of the accepted round and the store that reproduces it; the bundle is copied from it, never regenerated by a different path.
  owned_paths:
    - src/repository_presenter/
    - tests/
    - schemas/
    - prompts/
    - migration/reuse-manifest.yaml
    - project/state.yaml
  acceptance:
    - "present writes candidates/<owner>__<name>/<revision>/ holding README.md, README.patch, facts.json, investigation.json, dispositions.json, plan.json, content_units.json, validation.json, review.json, repairs.json, calls.jsonl, dependencies.json, and manifest.json; manifest.json validates against schemas/candidate-bundle.schema.json with a checksum for every file, and candidates/<owner>__<name>/CURRENT names the revision."
    - "dependencies.json lists exactly the inputs the candidate consumed - source revision and relevant tree hash, every fact ID with its hash, every prompt manifest ID and content hash, model route, the contract version, every template component version rendered, every validator ID and version that ran, the acceptance profile version, the protected-content fingerprint, and the policy hash - and nothing else."
    - "A fresh process on the same inputs reproduces every bundle file byte for byte with zero provider calls, the ledger recording one cache reuse per job; check 11 is judged from that replay and validation.json rewritten with its verdict; manifest.json records READY_FOR_PROPOSAL only when every blocking check passes."
    - "No configured secret appears in the bundle; check 9 runs over the bundle directory and status refuses a bundle that leaks one."
    - "status prints 1/34 from the sealed bundle on disk, and project/state.yaml records current_candidates 1 with the bundle path as evidence."
    - "Every pulled legacy file has one manifest file record with its SHA-256 at the frozen revision, a cut import closure, and ported tests; every new module has a production importer exercised by present."
    - "ruff, ruff format, mypy, and pytest pass locally on Python 3.11, 3.12, and 3.13 with the gateway faked; the commit is pushed and hosted CI is watched to completion."
  evidence_required:
    - The sealed bundle for the canary at its pinned revision with manifest.json and dependencies.json, the replay ledger showing zero provider calls, and the status output printing 1/34.
    - Manifest file records for every pulled legacy file.
  blocker: null

