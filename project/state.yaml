active_work_item:
  id: G2-W07
  status: READY
  purpose: "Repair three defects the 65b1f577 review accepted as advisory whose causes are code or coverage (RESEARCH_AND_GUIDELINES.md section 26; README_CONTRACT.md check 4 and row 14 as revised 2026-09-04): (1) key_capabilities units unbound from their slot - three of seven cite a different slot's facts; the S9 binding guard requires a unit's fact_ids to lie within its plan slot's fact set, so this blocks at validation and never reaches the reviewer as prose; (2) fourteen classes listed twice in the API table (a package re-export and the class inside a same-named module) - collapse to one fact per canonical defining location and add a uniqueness check by that identity; (3) At a Glance lacks Starting Points and lists two of four output formats - corroborate declared formats statically from FileFormat and importer/exporter plugin registrations alongside executed examples so inputs and outputs reach SUPPORTED. The Enterprise paragraph names only verified additions. Re-seal superseding 65b1f577. Acceptance: the two new checks exist, pass, and block on a synthetic violation; 305 to 330 unique API rows; Starting Points names OBJ, STL, glTF, COLLADA, and 3MF; review ACCEPT with zero code-caused advisories, judged by test."
  prerequisites:
    - G2-W06 is accepted (evidence/build/G2_STABILITY_UNDER_CHANGE/manifest.json) and its pushed main has a green hosted CI run, checked at the start of the iteration.
    - docs/RESEARCH_AND_GUIDELINES.md sections 22.1 and 26, docs/README_CONTRACT.md check 4 and row 14 as revised on 2026-09-04, and project/loop-prompt.md section 5 (an advisory's cause is decided by test) are read in full before any change under validation/, composition/, or extractors/; the sealed bundle at candidates/aspose-3d-foss__Aspose.3D-FOSS-for-Python/65b1f577c0f16d0d9112bb6c1153d3024543ac02 with its review.json advisories is the baseline every fix is judged against.
  owned_paths:
    - src/repository_presenter/
    - tests/
    - prompts/
    - schemas/
    - project/state.yaml
  acceptance:
    - "Slot-bound binding (check 4 as revised): a unit's fact_ids lie within the fact set the plan assigned to its slot, a capability description citing its own title's facts and never another slot's; the rule holds at authoring (unit_checks) and blocks at S9 (BC-04), a synthetic violation fails the check in a test, and the re-sealed canary's seven Key Capabilities each cite their own slot's facts."
    - "Canonical identity (row 14 as revised): the public-symbol collapse keys each type by its canonical defining location so a package re-export and the class inside a same-named module are one fact, a uniqueness check by that identity blocks a synthetic duplicate in a test, and the re-sealed canary's Core API table holds 305 to 330 unique rows with no pair of the form formats.X / X.X."
    - "Format corroboration (section 22.1): declared formats are corroborated statically from FileFormat and importer/exporter plugin registrations alongside executed examples, so on the re-sealed canary Starting Points names OBJ, STL, glTF, COLLADA, and 3MF and Outputs lists every format the product writes; a format no static or executed evidence corroborates stays UNRESOLVED."
    - "The Enterprise paragraph names only verified additions, and the re-sealed candidate at 65b1f577 (adopted in place per section 25 gap 2, the equivalent of superseding at the same revision) passes every blocking check with a review of ACCEPT whose advisories, if any, are each shown by test to be beyond any deterministic check's reach; present three times: seal, adopt, and reproduce with zero provider calls."
    - "ruff, ruff format, mypy, and pytest pass locally on Python 3.11, 3.12, and 3.13 with the gateway faked; the commit is pushed and hosted CI is watched to completion."
  evidence_required:
    - The two new checks with their synthetic-violation tests and the re-sealed bundle's validation.json showing them passing.
    - The canary's facts.json with the corroborated format facts and the collapsed symbol count, and its README with the At a Glance and API table rows counted.
    - The work-item record in evidence/build/G2_STABILITY_UNDER_CHANGE/manifest.json.
  blocker: null

