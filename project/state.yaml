active_work_item:
  id: G1-W03
  status: BLOCKED_EXTERNAL
  purpose: "LLM jobs - governed prompt manifests under prompts/, the preflight command that reaches the gateway without leaking the key; the transport is built on the openai SDK per RESEARCH_AND_GUIDELINES.md section 18.2, not call_transport.py's requests-based protocol handling, unless evaluating the SDK against the gateway finds a documented reason otherwise; pull the call schema, ledger, prompt registry, and prompt hygiene after the CPL-01 cut; consumes OWNER-02."
  prerequisites:
    - G1-W02 is accepted and its pushed main has a green hosted CI run, checked at the start of the iteration.
    - OWNER-02 is satisfied - .env at the repository root provides LLM_BASE_URL and LLM_API_KEY (and LLM_MODEL if the default is wrong), read only through the configured loader and never printed.
    - docs/RESEARCH_AND_GUIDELINES.md section 18.2 names the openai SDK as the transport; docs/README_CONTRACT.md section 3 stages S3 to S6 and section 4 define the jobs, their packets, and their typed outputs.
  owned_paths:
    - src/repository_presenter/
    - tests/
    - schemas/
    - prompts/
    - migration/reuse-manifest.yaml
  acceptance:
    - "repository-presenter preflight reaches the gateway's /models endpoint through the configured loader and prints the model route without printing, logging, or persisting the key; without .env it exits 2 naming OWNER-02 and its resume predicate."
    - One governed prompt manifest per job under prompts/ (repository_investigation, source_reconciliation, presentation_planning, section_authoring, independent_review, targeted_repair), each with a schema-validated packet and a typed output bound to fact IDs; an output that names an unknown or contradicted fact ID is rejected before use.
    - Every provider call is recorded by the ledger in calls.jsonl with its job, prompt manifest hash, model route, and token counts, and the calls reconcile with the ledger.
    - Every pulled legacy file (call schema, ledger, prompt registry, prompt hygiene after the CPL-01 cut) has one manifest file record with its SHA-256 at the frozen revision, a cut import closure, and ported tests; every new module has a production importer exercised by present or preflight.
    - ruff, ruff format, mypy, and pytest pass locally on Python 3.11, 3.12, and 3.13 with the gateway faked in tests; the commit is pushed and hosted CI is watched to completion.
  evidence_required:
    - A preflight transcript against the real gateway with the key redacted.
    - Manifest file records for every pulled legacy file.
  blocker:
    class: BLOCKED_EXTERNAL
    summary: OWNER-02 is OPEN - no .env with LLM_BASE_URL and LLM_API_KEY exists at the repository root, so no gateway can be reached and no LLM job can be exercised end to end on the canary; every remaining G1 item and all of G2 depend on these jobs.
    resume_predicate: .env exists at the repository root, is gitignored, and provides LLM_BASE_URL and LLM_API_KEY; then G1-W03 returns to READY and repository-presenter preflight is the first check of the next iteration.
    recorded_at: "2026-09-02T16:46:24+05:00"

