    - "All eleven blocking checks pass on the re-composed canary, the independent review returns ACCEPT with zero advisory findings whose cause is deterministic code, and review.json findings F02 and F07 of the sealed bundle are resolved."
    - "A section-by-section diff against the live README of aspose-3d-foss/Aspose.3D-FOSS-for-Python shows no section, image, link, or verified public type the live README has that this candidate lacks, and no description in this candidate's API table that is mechanical filler."
