closing with the Enterprise Edition paragraph resolved from a live products.aspose.com check; Development and Testing in prose with the exact single-target command and a release-workflow link; the License sentence shape; the visible-length budget applied to lines outside details only. Resolve review.json F02 and F07. Acceptance: regression tests prove each placement rule; every section of the re-composed canary matches its shell row; all eleven blocking checks pass; independent review returns ACCEPT with zero code-caused advisory findings; a section-by-section diff against the live README shows no section, image, link, or verified public type the live README has that this candidate lacks, and no description in this candidate's API table that is mechanical filler; the new sealed bundle supersedes candidates/aspose-3d-foss__Aspose.3D-FOSS-for-Python/d9f3bfe50d47e8156266955dda52ec5abf2d9dec per manifest.json's superseded_by field with a byte-identical zero-call rerun. The badge registry keyed by ecosystem is specified now and generalised when G2-W07 adds the second ecosystem."
