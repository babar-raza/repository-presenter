ared code and the composed input changed. STILL NOT SEALED, FOR A DIFFERENT, NEWLY MEASURED CAUSE: BC-07 failed again (377 visible lines of 799 against budget 300, a different overage than run 1''s 307/792), one repair attempt recorded repaired then re-raised identically. THE LEDGER ITSELF IS PARTLY FALSE, PROVEN WITHOUT ASSUMING THE PRE-REPAIR STATE: repairs.json''s attempt claims additional_example_ids shrank from 5 to 4 items, but the accepted, final plan.json still carries all 5 - that claimed reduction never happened. The one change the final plan does corroborate (capability_titles growing to 7, matching core_capabilities) is purely additive and could not have closed a length-budget overage. That is PROPOSAL E18: _refuse_noop and plan_checks both passed this revision because neither verifies a changes[] entry against the object it describes, nor weighs a change against the failing check''s own measured quantity. Lane E proposes no fix (shared code) and names three owner choices in docs/RESEARCH_LANE_E.md''s dated entry: E16''s original choices 1/2, or a narrower strengthening of item 84 itself (corroborate each changes[] entry against the actual revision). No third present attempt was made - a third live composition would remeasure the same class of variance already measured twice, not a fresh finding. No seal is claimed and the counted unit does not move: repository-presenter status reads 12/34 both before and after, and project/state.yaml was not opened.'
  lane_e_05_note: 'Run 1 of LANE-E-05, 2026-09-16 14:35 UTC, on origin/main at 6f2161f, no rebase needed (branch lane-e/LANE-E-05, worktree C:\w\e05); evidence/build/lanes/lane-e/LANE-E-05.json. First draw of aspose-words-foss/Aspose.Words-FOSS-for-Python, drawn by the supervisor because arrival item 52 (4995eb4, landed 2026-09-16T17:44:58+05:00) fixes the G3 second-pass class EXAMPLE_RUNNER_IGNORES_REQUIRES_PYTHON - this is item 52s own named unlock - and no run of any kind had been made against the fix. ITEM 52 IS CLOSED, VERIFIED BY RUNNING THE REPOSITORY: facts-only at 2d2efee2 (unchanged from the second pass) measured examples 12 candidates, 12 executed, required rows without evidence none, matching item 52s own commit measurement (12/12 EXECUTED under py312) exactly. runs/verify/py311 and py312 were provisioned fresh via uv (a fresh worktree ships none). AFTER THE ENVIRONMENT WAS CONFIRMED (f4406f1b... on the first attempt) THE FULL PIPELINE RAN TO S10 REVIEW AND DID NOT SEAL, FOR A NEW CAUSE: validation pass 9 fail 1 (BC-10) pending 1 (BC-11, never reached) - review verdict REJECT_PRESENTATION, one blocking finding F08 (additional_examples: the original READMEs File-to-description table is missing), six findings folded to advisory correctly via their own reviewer_scope_defect. ONE REPAIR ATTEMPT RAN AND WAS RECORDED REPAIRED, THEN THE IDENTICAL FINDING RE-RAISED. READING THE FACTS AND DISPOSITIONS DIRECTLY SETTLES WHY: the omitted table is captured verbatim as inherited_unit:038.table, polarity SUPPORTED (the maintainer really wrote it) - but dispositions.json marks its disposition OMIT_UNSUPPORTED, rationale "the facts do not verify its content" (S4 reconciliation correctly refused to compose the maintainers unverified per-file behavioural claims). The repairs revised_output could only append bare filenames (no fact carries the per-file descriptions), which the reviewer correctly still found insufficient. That is PROPOSAL E17: scope_defect/excluded_evidence_defect (review/independent/review.py:823-912) reads only a facts polarity via by_id, never dispositions.json, so it cannot see that reconciliation already, correctly, excluded this content - the one call site with dispositions already in scope (repair/rounds.py:221) threads it into renderer_sentences three lines above its review_document call (rounds.py:317-335) but not into review_document itself. Lane E proposes no fix (shared code) and names three choices for the owner: thread dispositions into scope_defect and add a disposition-aware exclusion rule, teach additional_examples authoring to draw a fact-bound file/description mapping the way api_reference already does for four of the same eight files, or narrow S4s whole-table OMIT_UNSUPPORTED judgment to per-row partitioning. No second repair attempt was made (the targeted-repair call is deterministic; a retry reproduces the same call byte for byte). No seal is claimed and the counted unit does not move: repository-presenter status reads 12/34 both before and after, and project/state.yaml was not opened.'
