estigation/, core/llm/binding.py against run 2''s base): rejected-1 named format:input.txt + public_symbol:aspose.words_foss.ooxml_save_options, rejected-2 narrowed to the latter alone - a DIFFERENT hallucination on the byte-identical request hash 81dae25fffe5 (temperature 0.0, seed 1 per the manifest), evidence of upstream model-serving variance the sampling block cannot pin. NEITHER HALLUCINATION INVENTED A CAPABILITY - BOTH MISCITED A REAL ONE: facts.json has no format:input.txt fact at all (not even UNRESOLVED - no evidence entry exists for that key) even though reader_factory.py:39-42 genuinely dispatches .txt to a real TextFileReader (public_symbol:aspose.words_foss.text_reader.textfilereader, present in facts.json) - the static format-declarations scanner (extractors/platforms/python_format_declarations.py) only recognizes a register_plugin/FileFormat.py pattern this repository does not use (it dispatches via a plain if/elif chain in reader_factory.create_reader), so every format fact here depends solely on an executed example, and none reads a .txt file; and public_symbol:aspose.words_foss.ooxml_save_options does not exist, but public_symbol:aspose.words_foss.saving.ooxmlsaveoptions (the real OoxmlSaveOptions class) does - the model dropped the saving. module segment. THAT IS PROPOSAL E22: repository_investigation (rounds.py:189-191) is the one fact-citing job with no call_schema= override at all - source_reconciliation, presentation_planning and section_authoring all pass one built via planning.py''s _pin_fact_id_arrays/citable_fact_ids mechanism (items 59/77''s own fix for this identical shape of defect one stage later), but investigation''s prompts/repository_investigation.yaml schema leaves every fact_ids array a bare, unpinned string array, so core/llm/binding.py''s binding_errors only catches a bad citation after the live call already ran and the one re-ask was spent. Lane E proposes the minimal, most direct fix: give repository_investigation its own c