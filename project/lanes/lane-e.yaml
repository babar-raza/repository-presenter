osite directions of the same extension. README.md:131-138''s actual Quick Start code is doc = aw.Document("report.docx") then doc.save("report.md", aw.SaveFormat.MARKDOWN) - report.md is written, never opened; the format:input.md fact is wrong. THAT IS PROPOSAL E23: extractors/platforms/python_examples.py::stage_fixtures stages a fixture under every file-like string literal an example''s code contains (here, the comment "# or .doc, .rtf, .txt, .md" on the Document(...) line makes ".md" such a literal) with no check for whether that literal is a read argument or a write/save target; evidence/facts/formats.py::format_facts (lines 60-71) then unconditionally reports every staged-and-executed fixture as format:input.<ext> SUPPORTED evidence, with no cross-check against the same function''s own claims_for-derived output direction for the identical example three lines earlier (lines 39-57) - so the function contradicts itself and never notices. Lane E proposes the minimal fix: when fixture-staging and claims_for name opposite directions for the same example ordinal and extension, the syntax-tree-derived (claims_for) direction is the more precise source and should suppress the fixture-staging claim for that example - not a general read/write argument-position parser for stage_fixtures, which would be materially larger. Full evidence, exact file:line citations and the disposition table are in docs/RESEARCH_LANE_E.md''s dated entry (2026-09-17 03:23 UTC). No seal is claimed and the counted unit does not move: repository-presenter status reads 17/34 both before and after, and project/state.yaml was not opened.'
