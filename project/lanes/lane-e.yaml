  newest_note: 'Run 1 of LANE-E-02, 2026-09-11 17:13 UTC, on origin/main at c0da8e1 (branch lane-e/LANE-E-02); evidence/build/lanes/lane-e/LANE-E-02.json. NO SEAL AND THE COUNTED UNIT DOES NOT MOVE - repository-presenter status reads 9/34 before and after and this PR adds no candidates/ directory. THE ITEM''S GATE WAS CHECKED BEFORE STARTING, NOT ASSUMED, AND ONE THIRD OF IT IS STILL SHUT: items 41 and 42 did land (unblocked.jsonl names both repositories), but item 43 did NOT - the spawn instruction identified dd7dc73 as item 43 and dd7dc73 is arrival item 46 (''a protected command''s own placeholder bracket is not HTML''), whose ledger line unlocks lane-d''s PDF-Go. unblocked.jsonl has no line 43; the primary''s own sprint ledger entry for the 41+42 commit says ''BarCode waits on item 43''; and BC-07''s heading rule at validation/registry.py:862-873 was last touched by 9661e49 (G2-W03, 2026-09-03). So aspose-barcode-foss/Aspose.BarCode-FOSS-for-Python was not run and no provider call was spent on it - its G3 disposition API_REFERENCE_HEADING_JUDGED_AS_PROSE stands, and arrival item 58 states the same fix more precisely, so 43 and 58 look like one card. HTML-PYTHON: ITEM 41 WORKED, MEASURED. Its recorded class PLAN_PICKS_A_CONTRADICTED_EXAMPLE_FOR_THE_QUICK_START is closed - the plan chose example:001 (SUPPORTED) where the second pass twice chose example:006, the set''s only CONTRADICTED example, and presentation_planning made one call and passed on attempt 1. It then ran 33 calls and stopped two stages later at S6 section_authoring, rejected twice on its scope_limitations units: ''identifiers that are not accepted fact values: CSSRule.css_text, CSSRule.type, css_text'' and ''HTMLImageElement.decode''. Every one of those is spelled verbatim inside inherited_unit:089.list - the repository''s own README limitations list, a SUPPORTED fact the rejected unit itself cites. Measured on the real facts: identifier_tokens() on that value returns all four; command_block_tokens