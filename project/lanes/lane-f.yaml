  run_2: 'Run 2 (2026-09-11, worktree C:\w\f02, branch lane-f/LANE-F-01-R2 off 2b9d191, which carries the S4 fix 352fd35). The S4 blocker is GONE and confirmed on two repositories: source_reconciliation succeeded on both, 70 dispositions over 70 inherited units on 3D-.NET citing 128 fact IDs, 57 distinct, 0 unknown, 0 bare kind-prefixes. Nothing sealed; 8/34 unchanged. (1) 3D-.NET reached S9 (VALIDATING), five stages further than run 1, and is dispositioned BLOCKED_VALIDATION (BC-07): validation pass 7 / fail 2 / pending 2, BC-07 FAIL at COMPOSING on "heading ''### ThreeD.Property'' is not a shell heading in title case" and BC-02 FAIL at EXTRACTING on an unreadable nuget probe; both recorded unrepairable. BC-10 never ran, so the 2026-09-06 PlyReader/PlyWriter question is STILL OPEN - no review verdict was produced. (2) Email-.NET aborted at S5 with "presentation_planning: output rejected twice" and is dispositioned BLOCKED_PLANNING, not BLOCKED_REVIEW as recorded - its review-stage unlocks (item 28, PA-02) remain untested. (3) PDF-.NET and (4) Slides-.NET were measured facts-only and not run; their G4 manifest rows stand unamended. Three PROPOSALs for the primary: F8 (BC-07 re-implements the renderer''s _table_names heading model - 34 instances on PDF-.NET), F9 (the shared registry facade never retries; RETRY_POLICIES["package_registry"] exists but only the Python platform uses it - 5 of 10 nuget readings unreadable today, the cohort''s top blocker), F10 (presentation_planning''s four fact_ids arrays carry no enum - item 40''s class at S5, cost Email-.NET its whole run). Lane E''s E3 did NOT materialise: all 24 call records are http_status 200, and the enums are bounded by symbol depth and declared kinds, not SYMBOL_CAP (3D-.NET 352 entries / 16.7 KB; PDF-.NET 999 / 48.2 KB). Slides-.NET''s recorded BC-02 blocker is STALE - its package now reads "found on nuget" and upstream moved to 9f2d8710, with 8 of 9 examples executing against the row''s 1 of 9. Resume: Slides-