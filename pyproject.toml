[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repository-presenter"
dynamic = ["version"]
description = "Autonomous, GitHub-native README presentation for authorized product repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
repository-presenter = "repository_presenter.cli:main"

[project.urls]
Source = "https://github.com/babar-raza/repository-presenter"

[tool.hatch.version]
path = "src/repository_presenter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repository_presenter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
