[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repository-presenter"
dynamic = ["version"]
description = "Autonomous, GitHub-native README presentation for authorized product repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "markdown-it-py>=3.0",
    "openai>=3.7",
    "pydantic>=2.10",
    "tenacity>=9.0",
    "pyyaml>=6.0.2",
    # The vendored surface extractor parses six languages through tree-sitter (section 29.6 E2).
    # Pinned exactly, not by floor: a grammar release changes node types, and a node type is what
    # a symbol_kind is read from, so an unpinned bump would move facts under a sealed candidate.
    "tree-sitter==0.26.0",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-language-pack==1.16.1",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    # The suite installs the canary into a throwaway venv on every worker. With build isolation
    # pip fetches its build backend from PyPI once per install, and under -n auto (27 workers
    # here) those fetches fail: measured 2026-09-06, "pip subprocess to install build
    # dependencies did not run successfully", leaving the examples NOT_VERIFIED and a different
    # test red on each run. tests/conftest.py turns build isolation off, which needs the backend
    # present in this environment.
    "setuptools>=75",
    "wheel>=0.45",
    "types-PyYAML>=6.0.12",
    "types-jsonschema>=4.23",
]

[project.scripts]
repository-presenter = "repository_presenter.cli:main"

[project.urls]
Source = "https://github.com/babar-raza/repository-presenter"

[tool.hatch.version]
path = "src/repository_presenter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repository_presenter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Sealed bundles are content-addressed evidence, never source, and vendored code stays byte-close
# to its origin so the next pull is a diff and not a merge (section 29.6 E2): the linter and the
# formatter leave both alone, and the relaxation reaches nothing else.
extend-exclude = ["candidates", "src/repository_presenter/components/readme/extractors/surface/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
platform = "linux"
files = ["src"]

[[tool.mypy.overrides]]
# Confined to the vendor boundary: nothing outside it is exempt (section 29.6 E2, F4).
module = "repository_presenter.components.readme.extractors.surface._vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = [".", "tests"]
